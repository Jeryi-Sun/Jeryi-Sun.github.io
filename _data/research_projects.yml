- id: rearter
  title: "ReARTeR: Retrieval-Augmented Reasoning with Trustworthy Process Rewarding"
  short_title: "ReARTeR"
  venue: "SIGIR 2025"
  role: "First author"
  authors: "Zhongxiang Sun, Qipeng Wang, Weijie Yu, Xiaoxue Zang, Kai Zheng, Jun Xu, Xiao Zhang, Song Yang, Han Li"
  layer: "Metacognitive Control"
  paper_url: "https://arxiv.org/abs/2501.07861"
  project_url: "/ReARTeR_Page/"
  code_url: "https://github.com/Jeryi-Sun/ReARTeR"
  teaser: "/images/research/rearter-teaser.png"
  hero_image: "/images/research/rearter-rartpr-example.png"
  one_liner: "A process-rewarding framework for trustworthy multi-step retrieval-augmented reasoning."
  summary: "ReARTeR makes retrieval-augmented reasoning reliable at the process level. It combines scalar process rewards, aligned natural-language explanations, bias-aware look-ahead search, and step-level post-training to improve intermediate reasoning and final answers."
  research_question: >-
    How can retrieval-augmented reasoning receive trustworthy supervision throughout test-time search and
    post-training?
  motivation: >-
    A final answer can be correct for unsupported reasons or wrong because an earlier sub-query, retrieval
    decision, or reasoning step failed. Long-horizon agents need feedback inside the reasoning process.
  approach: >-
    ReARTeR decomposes retrieval-augmented reasoning into intermediate steps and uses process reward signals
    to guide test-time search and post-training improvement.
  research_impact: >-
    ReARTeR provides the process-rewarding foundation for metacognitive control by making intermediate
    evidence use and reasoning quality visible to training and inference.
  abstract: "Retrieval-augmented reasoning systems should not only retrieve useful documents and produce a final answer. They also need reliable intermediate reasoning. ReARTeR introduces trustworthy process rewarding for retrieval-augmented reasoning, evaluating step quality, evidence use, and reasoning consistency throughout the process."
  method_summary: "ReARTeR decomposes retrieval-augmented reasoning into intermediate process steps and assigns trustworthy process feedback to evidence use, step validity, and reasoning consistency. It combines test-time search with process reward modeling and post-training scaling, making process-level reward a practical foundation for later metacognitive monitoring."
  figures:
    - image: "/images/research/rearter-rartpr-example.png"
      label: "RARTPR example"
      role: "Problem"
      source: "Paper Fig. 1; samples/graph/intro.pdf"
      layout: "two-column"
      caption: "A complex multi-step question requires sub-query decomposition, adaptive retrieval, reasoning thought, and process feedback rather than a single final-answer judgment."
    - image: "/images/research/rearter-test-time-scaling.png"
      label: "Test-time scaling"
      role: "Method"
      source: "Paper Fig. 2; samples/graph/model_graph_1.pdf"
      layout: "wide"
      caption: "ReARTeR collects process-reward training data, reduces early-step bias, and aligns PEM explanations with PRM scores during test-time search."
    - image: "/images/research/rearter-post-training-scaling.png"
      label: "Post-training scaling"
      role: "Method"
      source: "Paper Fig. 3; samples/graph/model_graph_2.pdf"
      layout: "wide"
      caption: "The post-training stage uses warm-up and step-level offline reinforcement learning to improve retrieval-augmented reasoning behavior."
  figure_guide:
    - image: "/images/research/rearter-rartpr-example.png"
      title: "Why final-answer supervision is too coarse"
      role: "Problem"
      source: "Paper Fig. 1; samples/graph/intro.pdf"
      layout: "two-column"
      summary: "A complex question requires sub-query decomposition, retrieval, reasoning thought, and process feedback."
      reading_guide:
        - "The figure shows that reliability depends on intermediate steps, not only the final answer."
        - "A wrong sub-query or unsupported reasoning step can corrupt the final response."
        - "This motivates process rewarding as supervision inside the reasoning trajectory."
    - image: "/images/research/rearter-test-time-scaling.png"
      title: "Using process rewards at test time"
      role: "Method"
      source: "Paper Fig. 2; samples/graph/model_graph_1.pdf"
      layout: "wide"
      summary: "ReARTeR collects process-reward data and uses evaluators to guide search over reasoning paths."
      reading_guide:
        - "The process reward model evaluates intermediate retrieval and reasoning steps."
        - "Bias reduction and explanation alignment make process evaluation more trustworthy."
        - "The key point is that inference is guided by step-level quality rather than only answer likelihood."
    - image: "/images/research/rearter-post-training-scaling.png"
      title: "Post-training with step-level feedback"
      role: "Method"
      source: "Paper Fig. 3; samples/graph/model_graph_2.pdf"
      layout: "wide"
      summary: "Warm-up and step-level offline reinforcement learning turn process feedback into improved retrieval-augmented reasoning behavior."
      reading_guide:
        - "This figure connects process evaluation to model improvement."
        - "Step-level feedback provides a training signal for trustworthy intermediate behavior."
        - "The method becomes a foundation for agents that monitor and repair their reasoning processes."
  result_sections:
    - eyebrow: "Finding 1"
      title: "Trustworthiness must be evaluated inside the reasoning process"
      body: "A final answer can be correct for the wrong reasons or wrong because of an earlier unsupported step. ReARTeR shifts supervision toward intermediate evidence use and process quality."
    - eyebrow: "Finding 2"
      title: "Process rewards connect explanation with optimization"
      body: "Step-level feedback makes it possible to identify where the reasoning process fails and to use that signal as a training or post-training objective."
    - eyebrow: "Finding 3"
      title: "Process rewarding is a bridge to metacognitive control"
      body: "By making intermediate failures visible, ReARTeR provides a practical foundation for agents that monitor, diagnose, and repair their own execution process."
  impact: "ReARTeR is the process-rewarding foundation of the metacognitive-control layer. It turns retrieval-augmented reasoning from a final-answer task into a supervised process that can be monitored and improved."
  citation: |
    @inproceedings{sun2025rearter,
      title={ReARTeR: Retrieval-Augmented Reasoning with Trustworthy Process Rewarding},
      author={Sun, Zhongxiang and Wang, Qipeng and Yu, Weijie and Zang, Xiaoxue and Zheng, Kai and Xu, Jun and Zhang, Xiao and Song, Yang and Li, Han},
      booktitle={Proceedings of the 48th International ACM SIGIR Conference on Research and Development in Information Retrieval},
      pages={1251--1261},
      year={2025}
    }
  homepage_priority: 50
  show_on_homepage: true

- id: mcm_ds
  title: "Deep Search with Hierarchical Meta-Cognitive Monitoring Inspired by Cognitive Neuroscience"
  short_title: "DS-MCM"
  venue: "SIGIR 2026"
  role: "First author"
  authors: "Zhongxiang Sun, Qipeng Wang, Weijie Yu, Jingxuan Yang, Haolang Lu, Jun Xu"
  layer: "Metacognitive Control"
  paper_url: "https://arxiv.org/abs/2601.23188"
  project_url: "/MCM_DS_Page/"
  code_url: "https://github.com/ChangWang9/MC-DSA"
  teaser: "/images/research/mcm-ds-teaser.png"
  hero_image: "/images/research/mcm-ds-hierarchical-monitoring-web.png"
  one_liner: "A deep-search framework that calibrates reasoning uncertainty against evidence uncertainty and triggers experience-driven correction."
  summary: "DS-MCM brings meta-cognitive monitoring into long-horizon search agents. It adds fast monitoring, slower reflective diagnosis, and experience updating so that agents can detect abnormal states, attribute failures, correct themselves, and reuse lessons across tasks."
  research_question: >-
    How can a deep-search agent monitor its own execution, diagnose errors, and revise its behavior during
    long-horizon tasks?
  motivation: >-
    Deep-search agents interleave reasoning with evolving, incomplete, and sometimes conflicting evidence.
    Reliable execution requires explicit monitoring of how internal confidence aligns with external evidence.
  approach: >-
    DS-MCM adds fast consistency monitoring, slower experience-driven diagnosis, corrective suggestions, and
    optional online memory consolidation to the deep-search loop.
  research_impact: >-
    DS-MCM is the long-horizon regulation layer of the research program: it turns mechanism understanding
    into metacognitive monitoring, correction, and reusable control knowledge.
  abstract: "Deep-search agents face long-horizon reliability problems as reasoning and retrieval evolve under partial or conflicting evidence. DS-MCM introduces hierarchical meta-cognitive monitoring so that search agents can detect abnormal states, reflect on causes, correct their execution, and update experience."
  method_summary: "The framework places monitoring above retrieval, reasoning, feedback interpretation, and experience updating. A fast consistency monitor detects local mismatches between retrieved evidence uncertainty and reasoning uncertainty. A slower experience-driven monitor diagnoses root causes, decides whether to re-search or re-plan, and stores corrective experience for future tasks."
  figures:
    - image: "/images/research/mcm-ds-hierarchical-monitoring-web.png"
      label: "Hierarchical metacognitive monitoring"
      role: "Problem"
      source: "Paper Fig. 1; graphs/introduction.pdf"
      layout: "two-column"
      caption: "The paper maps human fast and slow monitoring ideas onto deep-search agents, showing why standard search loops lack explicit mechanisms for detecting and correcting cognitive errors."
    - image: "/images/research/mcm-ds-method-framework.png"
      label: "DS-MCM execution pipeline"
      role: "Method"
      source: "Paper Fig. 2; graphs/method.pdf"
      layout: "wide"
      caption: "DS-MCM adds a fast consistency monitor, a slow experience-driven monitor, corrective suggestions, and optional online memory consolidation to the ReAct-style deep-search loop."
    - image: "/images/research/mcm-ds-sensitivity-entropy.png"
      label: "Sensitivity analysis"
      role: "Result"
      source: "Paper Fig. 3a; graphs/sensitivity_entropy_threshold.pdf"
      layout: "wide"
      caption: "The sensitivity analysis checks key hyperparameters, supporting the claim that the monitoring mechanism is not only a single fixed setting."
  figure_guide:
    - image: "/images/research/mcm-ds-hierarchical-monitoring-web.png"
      title: "Why deep-search agents need monitoring"
      role: "Problem"
      source: "Paper Fig. 1; graphs/introduction.pdf"
      layout: "two-column"
      summary: "The figure maps fast and slow monitoring ideas onto deep-search agents, showing why standard search loops are not enough."
      reading_guide:
        - "Deep-search agents can drift, misread evidence, or accumulate contradictions during execution."
        - "Fast monitoring catches local inconsistency, while slower monitoring supports diagnosis."
        - "This figure positions DS-MCM as a metacognitive layer above ordinary ReAct-style execution."
    - image: "/images/research/mcm-ds-method-framework.png"
      title: "DS-MCM execution pipeline"
      role: "Method"
      source: "Paper Fig. 2; graphs/method.pdf"
      layout: "wide"
      summary: "The method adds fast consistency monitoring, slow experience-driven monitoring, corrective suggestions, and optional online memory consolidation."
      reading_guide:
        - "The fast monitor compares uncertainty in reasoning and retrieved evidence."
        - "The slow monitor diagnoses root causes and decides whether to re-search, revise, or re-plan."
        - "Experience updates turn failures into reusable control knowledge for later tasks."
    - image: "/images/research/mcm-ds-sensitivity-entropy.png"
      title: "Checking robustness of the monitoring mechanism"
      role: "Results"
      source: "Paper Fig. 3a; graphs/sensitivity_entropy_threshold.pdf"
      layout: "wide"
      summary: "The sensitivity analysis checks whether the monitoring mechanism depends on a single fragile hyperparameter setting."
      reading_guide:
        - "The figure supports reading DS-MCM as a control framework with empirically tested operating settings."
        - "It helps show which settings affect monitoring behavior."
        - "The result connects the metacognitive design to empirical stability."
  result_sections:
    - eyebrow: "Finding 1"
      title: "Long-horizon search needs monitoring beyond final answers"
      body: "A search agent can drift, use insufficient evidence, misread feedback, or accumulate contradictions while still producing a confident final response. The control problem must be process-level."
    - eyebrow: "Finding 2"
      title: "Fast monitoring and slow reflection separate detection from diagnosis"
      body: "DS-MCM distinguishes local anomaly detection from experience-informed diagnosis, allowing agents to continue normally or revise subsequent execution."
    - eyebrow: "Finding 3"
      title: "Experience updating turns failures into reusable control knowledge"
      body: "The framework moves agents from passive next-step generation to self-evaluation, correction, and future-task adaptation."
  impact: "DS-MCM is the long-horizon regulation layer of the research program. It operationalizes the idea that trustworthy agents should monitor their own state, diagnose failure causes, and actively correct execution."
  citation: |
    @inproceedings{sun2026deep,
      title={Deep Search with Hierarchical Meta-Cognitive Monitoring Inspired by Cognitive Neuroscience},
      author={Sun, Zhongxiang and Wang, Qipeng and Yu, Weijie and Yang, Jingxuan and Lu, Haolang and Xu, Jun},
      booktitle={Proceedings of the 49th International ACM SIGIR Conference on Research and Development in Information Retrieval},
      doi={10.1145/3805712.3809549},
      year={2026}
    }
  homepage_priority: 60
  show_on_homepage: true
