  about_title: "个人简介"
  biography:
    - >-
      我是中国人民大学高瓴人工智能学院博士生，导师是徐君教授。我的研究方向是可信大模型与智能体、
      机制可解释性。预计于 2027 年 6 月毕业，目前正在寻找研究岗位。
    - >-
      我借鉴认知神经科学的研究方法，刻画模型内部的能力结构，分析失效机制，并研究长程任务中的行为调控。
      已以第一作者发表 CCF A/B 类论文 13 篇，其中 CCF A 类 10 篇；拥有授权发明专利 4 项。
      相关工作获 ICLR Spotlight、SIGIR-AP 和 CCIR 最佳论文奖。
  research_title: "研究与计划"
  research_url: "/zh/research/cognitive-neuroscience/"
  research_link: "完整研究规划"
  research_intro: "我的研究主线是“AI 智能体的认知神经科学”，通过行为实验、表征分析和因果干预，回答以下问题："
  threads:
    - title: "认知能力在模型内部怎样组织？"
      text: "NeuroCogMap 将稀疏特征、功能分区、能力层级和失效定位组织为内部认知图谱。"
      label: "NeuroCogMap"
      url: "https://neurocogmap.site/"
    - title: "推理、检索和记忆中的错误从何而来？"
      text: "ReDeEP 分析检索证据与参数知识的关系；RHD 研究推理过程的时间动态；FPPS 分析个性化记忆引起的事实偏移。"
      label: "失效机制研究"
      url: "/zh/research/cognitive-neuroscience/#module-mechanisms"
    - title: "智能体怎样在执行任务时纠正行为？"
      text: >-
        我研究长程智能体的元认知调控，将过程评估、分层自监控与基于行为证据的人工监督衔接起来。
        智能体持续检查推理与证据使用，识别偏差并触发反思和纠错；human-in-the-loop 监督
        则将关键决策、依据及潜在后果呈现给用户，让人的核验和反馈指导后续执行。
      paper_label: "EBG 论文"
      paper_url: "https://arxiv.org/pdf/2610.06406"
      label: "元认知调控"
      url: "/zh/research/cognitive-neuroscience/#metacognitive-control"
  publications_title: "代表论文"
  publications_url: "/zh/publications/"
  publications_link: "完整论文列表"
  paper_label: "论文"
  project_label: "项目主页"
  code_label: "代码"
  background_title: "个人经历"
  education_title: "教育经历"
  education:
