  about_title: "About"
  biography:
    - >-
      I am a Ph.D. candidate at the Gaoling School of Artificial Intelligence, Renmin University of China,
      advised by Prof. Jun Xu. I study trustworthy large language models and agents, with a focus on
      mechanistic interpretability. I expect to graduate in June 2027 and am seeking research positions.
    - >-
      My research draws on cognitive neuroscience to map how capabilities are organized inside models,
      identify the mechanisms behind failures, and intervene during long-running tasks. My first-author
      work includes 13 papers at CCF A/B venues (10 at CCF A venues). I also hold four granted invention
      patents. Research recognition includes an ICLR Spotlight and Best Paper Awards at SIGIR-AP and CCIR.
  research_title: "Research & Plans"
  research_url: "/research/cognitive-neuroscience/"
  research_link: "Full Research Program"
  research_intro: >-
    My current program, Cognitive Neuroscience of AI Agents, connects behavioral experiments,
    representation analysis, and causal intervention. The work follows three questions:
  threads:
    - title: "How are cognitive capabilities organized?"
      text: "NeuroCogMap connects sparse model features to functional parcels, capability hierarchies, and the localization of model failures."
      label: "NeuroCogMap"
      url: "https://neurocogmap.site/"
    - title: "What causes failures in reasoning, retrieval, and memory?"
      text: "ReDeEP studies the balance between retrieved evidence and parametric knowledge. RHD examines reasoning trajectories; FPPS studies factual drift caused by personalized memory."
      label: "Failure Mechanisms"
      url: "/research/cognitive-neuroscience/#module-mechanisms"
    - title: "How can an agent correct its behavior during a task?"
      text: >-
        I study metacognitive control for long-horizon agents, connecting process evaluation and
        hierarchical self-monitoring with evidence-grounded human oversight. Agents assess reasoning
        and evidence use to identify drift and guide reflection and correction. Human-in-the-loop
        monitoring makes consequential decisions, their evidence, and their implications available
        for user verification, allowing human judgment and feedback to guide subsequent execution.
      paper_label: "EBG Paper"
      paper_url: "https://arxiv.org/pdf/2610.06406"
      label: "Metacognitive Control"
      url: "/research/cognitive-neuroscience/#metacognitive-control"
  publications_title: "Selected Publications"
  publications_url: "/publications/"
