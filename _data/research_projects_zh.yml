- id: neurocogmap
  title: "NeuroCogMap Reveals Cognitive Organization of Large Language Models"
  short_title: "NeuroCogMap"
  venue: "arXiv 2026"
  role: "项目负责人"
  authors: "Zhongxiang Sun, Haolang Lu, Qiang Ma, Qi Li, Qipeng Wang, Liang Pang, Chenyu Liu, Qiankun Li, Hao Sun, Kun Wang, Yi Zeng, Jun Xu, Guoqi Li, Ji-Rong Wen"
  layer: "内部认知组织"
  paper_url: "https://arxiv.org/pdf/2607.00397"
  project_url: "https://neurocogmap.site/"
  code_url: "https://github.com/Jeryi-Sun/NeuroCogMap"
  teaser: "/images/research/neurocogmap-teaser.png"
  hero_image: "/images/research/neurocogmap-framework.png"
  one_liner: "连接稀疏特征、功能分区、认知能力、能力层级与病理定位的多层认知图谱。"
  summary: >-
    NeuroCogMap 为我的博士研究提供一套解释坐标。它把大语言模型视为可通过实验研究的人工认知系统，
    考察内部功能组织如何解释正常行为、异常行为、与人类皮层的对应关系，以及认知模型的发现过程。
  research_question: >-
    能否把大语言模型作为人工认知系统来研究，并在单个神经元和最终输出之间找到具有稳定结构的内部组织？
  motivation: >-
    常见评测能够说明模型会做什么，却很难回答某项能力在模型内部如何组织，也无法解释模型为何会在相近条件下失败。
    NeuroCogMap 在原始激活与基准结果之间建立中尺度图谱，用来补足这一层解释。
  approach: >-
    项目先提取模型内部的稀疏特征，再将其组织成功能分区并关联到认知能力，随后分析能力之间的层级关系及其异常模式。
  research_impact: >-
    NeuroCogMap 为“AI 智能体的认知神经科学”研究提供共同的内部坐标，使后续工作能够在同一框架下讨论能力、失效与干预。
  abstract: >-
    NeuroCogMap 研究大语言模型在单个神经元与最终输出之间是否存在可解释的中尺度组织。
    项目结合能力空间和内部激活构建认知图谱，将稀疏特征组织成功能分区、认知图谱、认知能力及其层级关系。
    这套图谱还用于比较正常回答与幻觉回答，把幻觉从最终输出错误进一步定位为异常激活、能力路由偏差和内部病理模式。
  method_summary: >-
    该框架提取模型内部的稀疏特征，将其聚类为可复现的功能分区，并把功能分区与认知能力相连。
    研究随后比较正常行为与异常行为中的分区激活和连接方式。对于工具使用、推理、个性化和元认知调控等后续研究，
    这套方法提供了一套可以共用的内部描述语言。
  figures:
    - image: "/images/research/neurocogmap-framework.png"
      label: "受认知神经科学启发的研究框架"
      role: "框架"
      source: "Paper Fig. 1"
      layout: "wide"
      caption: >-
        NeuroCogMap 借鉴认知神经科学的研究思路，通过认知任务和内部激活构建模型的中尺度组织图谱；
        这里借用的是方法，而不是把大语言模型等同于生物脑。
    - image: "/images/research/neurocogmap-structure.png"
      label: "多层认知结构"
      role: "机制"
      source: "Paper Fig. 2"
      layout: "wide"
      caption: >-
        图谱连接功能分区、认知图谱、能力激活与层级关系，为后续幻觉研究定位异常模型状态提供坐标。
    - image: "/images/research/neurocogmap-pathology-localization.png"
      label: "病理定位"
      role: "结果"
      source: "Paper Fig. 3"
      layout: "wide"
      caption: >-
        幻觉、偏见、越狱和迎合行为被放入同一图谱中分析，并在功能分区和认知能力层面呈现不同的表征异常模式。
  figure_guide:
    - image: "/images/research/neurocogmap-framework.png"
      title: "为什么需要认知图谱"
      role: "问题与框架"
      source: "Paper Fig. 1"
      layout: "wide"
      summary: "框架从认知任务和内部激活出发，构建模型组织的中尺度图谱。"
      reading_guide:
        - "这张图表达的是认知神经科学的方法类比，并不主张大语言模型就是生物脑。"
        - "图中把行为、内部激活和能力集合连在一起，说明单一基准分数为何不足以解释模型。"
        - "NeuroCogMap 在整个研究计划中负责提供坐标，后续的幻觉机制研究都可以落到这套坐标上。"
    - image: "/images/research/neurocogmap-structure.png"
      title: "从稀疏特征到认知能力"
      role: "机制"
      source: "Paper Fig. 2"
      layout: "wide"
      summary: "图谱把功能分区、认知图谱、能力激活与层级关系连接起来。"
      reading_guide:
        - "核心步骤是把零散的激活特征组织成具有一致功能的分区。"
        - "能力被视为结构化的内部系统，因此不同任务和失效类型可以在同一空间内比较。"
        - "这一级组织连接了局部可解释性与系统层面的解释。"
    - image: "/images/research/neurocogmap-pathology-localization.png"
      title: "定位模型的异常行为"
      role: "结果"
      source: "Paper Fig. 3"
      layout: "wide"
      summary: "幻觉及相关异常被表示为同一内部图谱中的异常模式。"
      reading_guide:
        - "幻觉在这里被处理为表征病理，而不只是错误答案。"
        - "不同异常行为可以通过其扰动内部组织的位置和方式进行比较。"
        - "这种定位思路继续延伸到证据使用、推理、个性化和元认知调控研究。"
  result_sections:
    - eyebrow: "发现 1"
      title: "内部组织为幻觉提供了定位坐标"
      body: >-
        NeuroCogMap 不把幻觉看成孤立的输出错误，而是在结构化内部空间中定位异常，具体考察功能分区、能力调用和层级组织。
    - eyebrow: "发现 2"
      title: "同一图谱可以解释正常能力与异常行为"
      body: >-
        解释正常认知能力的内部组织也可以用来比较真实回答与幻觉回答，从而在同一框架中分析能力及其失效。
    - eyebrow: "发现 3"
      title: "该框架支持跨模块机理研究"
      body: >-
        ReDeEP、RHD、FPPS、ReARTeR 和 DS-MCM 可以视为后续模块研究，它们分别把工具使用、推理、记忆和控制失效纳入内部机制分析。
  impact: >-
    NeuroCogMap 让大模型智能体的内部认知系统可以被观察和比较，也为后续的机制干预提供结构基础。
  citation: ""
  homepage_priority: 10
  show_on_homepage: true

- id: redeep
  title: "ReDeEP: Detecting Hallucination in Retrieval-Augmented Generation via Mechanistic Interpretability"
  short_title: "ReDeEP"
  venue: "ICLR 2025 Spotlight"
  role: "第一作者"
  authors: "Zhongxiang Sun, Xiaoxue Zang, Kai Zheng, Jun Xu, Xiao Zhang, Weijie Yu, Yang Song, Han Li"
  layer: "智能体模块机理"
  paper_url: "https://arxiv.org/abs/2410.11414"
  project_url: "/zh/ReDeEP_Page/"
  code_url: "https://github.com/Jeryi-Sun/ReDEeP-ICLR"
  teaser: "/images/research/redeep-teaser.png"
  hero_image: "/images/research/redeep-problem-conflict.png"
  one_liner: "从机制层面解释 RAG 幻觉：外部证据利用不足与参数知识依赖失衡。"
  summary: >-
    ReDeEP 研究检索增强生成中的工具与证据使用幻觉。它分离对外部证据敏感的通路和参数知识通路，
    在模型内部定位失效信号，并利用这套机制进行幻觉检测与干预。
  research_question: "检索增强生成系统已经获得相关外部证据，为什么仍会产生幻觉？"
  motivation: >-
    完成检索不等于真正使用证据。模型可能拿到正确文档，回答却仍由参数知识主导。
    只检查输出无法看见造成这类 RAG 失效的内部冲突。
  approach: >-
    ReDeEP 将生成过程拆分为外部上下文利用和参数知识依赖，并通过证据利用分数、知识依赖分数等内部通路信号检测和调节幻觉风险。
  research_impact: >-
    ReDeEP 让智能体的工具证据模块可以被检查：外部证据如何进入生成、何时没有发挥作用，以及可以怎样纠正。
  abstract: >-
    检索增强生成利用外部证据约束回答，但模型仍可能忽略、低估或违背检索文档。ReDeEP 从内部机制研究这一失效。
    它将 RAG 幻觉表示为外部证据通路与参数知识通路之间的失衡，并用模型内部信号检测风险、调节生成。
  method_summary: >-
    ReDeEP 将生成拆分为证据敏感计算和参数知识依赖。方法分析注意力中的证据通路、复制行为、前馈网络中的知识通路及残差流信号，
    并以通路失衡作为机制层面的幻觉指标。当内部状态出现风险时，调节方法会让生成更多地依据外部证据。
  figures:
    - image: "/images/research/redeep-problem-conflict.png"
      label: "RAG 冲突案例"
      role: "问题"
      source: "Paper Fig. 1; graphs/introduction.pdf"
      layout: "wide"
      caption: >-
        检索文档可以完全正确，但模型内部的参数知识仍可能与其冲突，因此 RAG 幻觉并不只是检索失败。
    - image: "/images/research/redeep-causal-framing.png"
      label: "因果框架"
      role: "机制"
      source: "Paper Fig. 2; graphs/related_work.pdf"
      layout: "wide"
      caption: >-
        ReDeEP 分离外部上下文通路与参数知识通路，避免检测方法把两类信息来源混在一起。
    - image: "/images/research/redeep-method.png"
      label: "外部上下文分数与参数知识分数"
      role: "方法"
      source: "Paper Fig. 3; graphs/method.pdf"
      layout: "wide"
      caption: >-
        方法分别计算模型在生成时使用外部上下文的程度，以及依赖参数知识的强度。
    - image: "/images/research/redeep-ecs-pks-results.png"
      label: "机制证据"
      role: "结果"
      source: "Paper Fig. 4; graphs/empirical_study_1.pdf"
      layout: "wide"
      caption: >-
        层与注意力头上的模式和分数差异表明，真实生成与幻觉生成在证据利用和参数知识依赖上具有不同的内部特征。
  figure_guide:
    - image: "/images/research/redeep-problem-conflict.png"
      title: "证据已经找到，却没有被采用"
      role: "问题"
      source: "Paper Fig. 1; graphs/introduction.pdf"
      layout: "wide"
      summary: "检索文档包含正确答案时，模型仍可能沿用内部先验。"
      reading_guide:
        - "这张图把检索成功和生成忠实性分开来看。"
        - "错误发生在证据返回之后，所以单靠提高检索质量无法解决。"
        - "由此需要分析模型如何在文档证据与参数知识发生冲突时作出选择。"
    - image: "/images/research/redeep-causal-framing.png"
      title: "RAG 中的两条信息通路"
      role: "机制"
      source: "Paper Fig. 2; graphs/related_work.pdf"
      layout: "wide"
      summary: "ReDeEP 将幻觉解释为外部上下文利用与参数知识依赖之间的失衡。"
      reading_guide:
        - "外部通路描述检索证据如何进入生成过程。"
        - "参数通路对应模型已经存储的知识和先验。"
        - "当模型在冲突中偏向不可靠的内部知识时，幻觉风险会上升。"
    - image: "/images/research/redeep-method.png"
      title: "度量证据利用和知识依赖"
      role: "方法"
      source: "Paper Fig. 3; graphs/method.pdf"
      layout: "wide"
      summary: "方法通过内部信号判断生成主要依据外部上下文还是模型已有知识。"
      reading_guide:
        - "External Context Score 衡量生成利用检索证据的程度。"
        - "Parametric Knowledge Score 衡量模型对内部知识通路的依赖。"
        - "检测器使用的是通路失衡，而不是只看最终文本。"
    - image: "/images/research/redeep-ecs-pks-results.png"
      title: "RAG 幻觉的内部特征"
      role: "结果"
      source: "Paper Fig. 4; graphs/empirical_study_1.pdf"
      layout: "wide"
      summary: "层、注意力头与分数差异支持幻觉生成具有不同内部特征这一判断。"
      reading_guide:
        - "结果把可观察的幻觉和内部计算联系起来。"
        - "分数模式说明真实生成与幻觉生成使用信息的方式不同。"
        - "这些证据使机制信号可以同时服务于检测和定向干预。"
  result_sections:
    - eyebrow: "发现 1"
      title: "有证据不等于使用证据"
      body: >-
        核心失效并非简单的检索缺失。模型即使收到有用证据，也可能让内部先验主导回答。
    - eyebrow: "发现 2"
      title: "RAG 幻觉具有内部通路特征"
      body: >-
        ReDeEP 分离证据敏感计算和知识驱动计算，把幻觉检测从输出分类转化为对信息使用方式的机制诊断。
    - eyebrow: "发现 3"
      title: "机制信号可以指导定向缓解"
      body: >-
        通路失衡既能提示风险，也能用于调节推理，使生成更多地依赖证据，从可解释性进一步走向干预。
  impact: >-
    ReDeEP 使智能体的工具证据模块可被检查。在整体研究中，它对应单步功能回路问题：智能体怎样读取外部证据、何时失效，以及如何纠正。
  citation: |
    @inproceedings{sun2025redeep,
      title={{ReDeEP}: Detecting Hallucination in Retrieval-Augmented Generation via Mechanistic Interpretability},
      author={Sun, Zhongxiang and Zang, Xiaoxue and Zheng, Kai and Xu, Jun and Zhang, Xiao and Yu, Weijie and Song, Yang and Li, Han},
      booktitle={International Conference on Learning Representations},
      year={2025}
    }
  homepage_priority: 20
  show_on_homepage: true

- id: rhd
  title: "Mechanistic Detection and Mitigation of Hallucination in Large Reasoning Models"
  short_title: "RHD / GRPO-R"
  venue: "ICLR 2026"
  role: "第一作者"
  authors: "Zhongxiang Sun, Qipeng Wang, Haoyu Wang, Xiao Zhang, Jun Xu"
  layer: "智能体模块机理"
  paper_url: "https://openreview.net/pdf?id=XU2STJa1Fi"
  project_url: "/zh/RHD_Page/"
  code_url: "https://github.com/Jeryi-Sun/Reasoning_Hallucination"
  teaser: "/images/research/rhd-teaser.png"
  hero_image: "/images/research/rhd-trajectory-case.png"
  one_liner: "从时间神经动力学分析大推理模型中的推理幻觉。"
  summary: >-
    RHD 将幻觉分析从最终答案推进到完整推理轨迹。它刻画多步推理中的早期波动、浅层模式匹配、错误回溯和伪验证，
    再用过程级奖励约束缓解这些失效。
  research_question: "大推理模型给出错误答案时，幻觉究竟在推理轨迹的哪个阶段形成？"
  motivation: >-
    大推理模型公开了中间步骤，但只看最终答案，仍无法区分扎实推理和偶然答对。
    RHD 把幻觉视为在最终回答之前逐步发展的时间过程。
  approach: >-
    方法使用 Reasoning Score、CV Score 和 Attention Score 跟踪推理轨迹，并据此设计过程级奖励约束，使推理路径更可靠。
  research_impact: >-
    RHD 对应研究计划中的推理规划模块。它把幻觉呈现为时间动力学问题，而不只是一项输出错误。
  abstract: >-
    大推理模型会生成较长的推理轨迹，这使我们能够把幻觉作为时间过程来研究。RHD 分析各个步骤的神经与行为动力学，
    GRPO-R 则加入过程级约束，减少不可靠的推理轨迹。
  method_summary: >-
    方法跟踪推理轨迹，识别与浅层模式匹配、早期波动、错误回溯、过度思考和伪验证相关的时间信号。
    Reasoning Score、CV Score 和 Attention Score 分别作为轨迹探针，再由诊断结果引出过程级奖励约束。
  figures:
    - image: "/images/research/rhd-method-score.png"
      label: "轨迹评分"
      role: "方法"
      source: "Paper Fig. 1; graphs/method.pdf"
      layout: "wide"
      caption: "RHD 计算 Reasoning Score、CV Score 和 Attention Score，量化推理深度及注意力在中间步骤中的变化。"
    - image: "/images/research/rhd-trajectory-case.png"
      label: "GSM-NoOp 轨迹案例"
      role: "问题"
      source: "Paper Fig. 2; graphs/case_study.pdf"
      layout: "wide"
      caption: >-
        同一道题的真实轨迹与幻觉轨迹呈现不同的逐步 Reasoning Score 动力学，说明只检查最终答案会遗漏形成错误的过程。
    - image: "/images/research/rhd-pattern-reasoning-score.png"
      label: "模式验证"
      role: "结果"
      source: "Paper Fig. 3a; graphs/js_div_comparison_correct.pdf"
      layout: "wide"
      caption: >-
        Reasoning Score 区分受误导与未受误导的步骤，CV Score 和 Attention Score 则捕捉早期波动与错误注意模式。
    - image: "/images/research/rhd-consistency-reasoning.png"
      label: "一致性与困惑度分析"
      role: "结果"
      source: "Paper Fig. 4a; graphs/reasoning_consistency.pdf"
      layout: "wide"
      caption: >-
        模式分析把 Reasoning Score 的变化同一致性、准确率和困惑度联系起来，使行为失效可以落到轨迹结构上解释。
  figure_guide:
    - image: "/images/research/rhd-method-score.png"
      title: "度量推理轨迹"
      role: "方法"
      source: "Paper Fig. 1; graphs/method.pdf"
      layout: "wide"
      summary: "RHD 定义轨迹级分数，使中间推理行为可以被量化。"
      reading_guide:
        - "Reasoning Score 用来判断一个步骤是在进行有效推理，还是停留在浅层模式匹配。"
        - "CV Score 和 Attention Score 分别刻画轨迹波动及注意力转移。"
        - "这张图给出了后续分析所依赖的测量方法。"
    - image: "/images/research/rhd-trajectory-case.png"
      title: "幻觉在答案出现前已经形成"
      role: "问题"
      source: "Paper Fig. 2; graphs/case_study.pdf"
      layout: "wide"
      summary: "真实轨迹与幻觉轨迹在最终答案出现之前，逐步动力学已经开始分化。"
      reading_guide:
        - "分析对象是整条推理路径，而不只是最终回答。"
        - "即使文字流畅、前后看似一致，误导性步骤也可能不断累积。"
        - "因此，大推理模型需要过程级诊断。"
    - image: "/images/research/rhd-pattern-reasoning-score.png"
      title: "验证受误导的推理模式"
      role: "结果"
      source: "Paper Fig. 3a; graphs/js_div_comparison_correct.pdf"
      layout: "wide"
      summary: "这些分数可以区分受误导与未受误导的步骤，并识别早期波动和注意力异常。"
      reading_guide:
        - "该结果检验所定义的分数是否对应真实失效状态。"
        - "早期不稳定可以作为后续幻觉的预警信号。"
        - "图中的结果支持时间动力学解释，而不是静态的答案分类。"
    - image: "/images/research/rhd-consistency-reasoning.png"
      title: "连接轨迹动力学与可靠性"
      role: "结果"
      source: "Paper Fig. 4a; graphs/reasoning_consistency.pdf"
      layout: "wide"
      summary: "模式分析将轨迹结构同一致性、准确率和困惑度关联起来。"
      reading_guide:
        - "图中用可观测的可靠性指标验证所分析的机制。"
        - "推理动力学与模型能否稳定得到正确答案相关，并非仅是表面形式。"
        - "这一结果说明 GRPO-R 应针对推理过程进行缓解，而不是等到最终答案再纠错。"
  result_sections:
    - eyebrow: "发现 1"
      title: "推理幻觉往往早于最终答案形成"
      body: >-
        模型输出答案之前，推理轨迹中可能已经积累不稳定转移、错误证据或不当回溯。因此需要分析完整轨迹。
    - eyebrow: "发现 2"
      title: "时间动力学揭示答案评测看不到的失效"
      body: >-
        早期波动、浅层匹配、过度思考和伪验证提供了一套机制语言，用来解释推理路径为何变得不可靠。
    - eyebrow: "发现 3"
      title: "过程奖励可以直接约束推理路径"
      body: >-
        GRPO-R 把诊断结果用于缓解，抑制不可靠的中间状态，而不是等到最终答案生成后再纠正。
  impact: >-
    RHD 是整体研究中的推理规划模块。它把智能体幻觉作为时间神经动力学问题处理，并连接内部轨迹诊断与过程调节。
  citation: |
