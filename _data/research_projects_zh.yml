- id: fpps
  title: "When Personalization Misleads: Understanding and Mitigating Hallucinations in Personalized LLMs"
  short_title: "FPPS"
  venue: "ACL 2026 Findings"
  role: "第一作者"
  authors: "Zhongxiang Sun, Yi Zhan, Chenglei Shen, Weijie Yu, Xiao Zhang, Ming He, Jun Xu"
  layer: "智能体模块机理"
  paper_url: "https://aclanthology.org/2026.findings-acl.395/"
  project_url: "/zh/FPPS_Page/"
  code_url: "https://github.com/zhengyi-ai/ACL2026"
  teaser: "/images/research/fpps-teaser.png"
  hero_image: "/images/research/fpps-personalization-case-web.png"
  one_liner: "从表征层面解释个性化记忆如何使事实行为发生偏移。"
  summary: >-
    FPPS 研究个性化诱发的幻觉。它分析长期用户历史和偏好信号如何与事实表征纠缠，
    并通过推理时表征调控，在保留个性化能力的同时减少事实偏移。
  research_question: "个性化语言模型如何既服务于用户特定任务，又不让用户历史扭曲客观事实？"
  motivation: >-
    当回答确实取决于用户历史时，个性化很有用；当用户情境与可验证事实冲突时，同一份记忆也可能成为事实风险。
    FPPS 将其视为长时间尺度上的记忆调制问题。
  approach: >-
    FPPS 区分个性化有益与事实受损的样本，定位对个性化敏感的模型层，探测事实风险，并仅在内部状态显示事实偏移时进行自适应调控。
  research_impact: >-
    FPPS 对应研究计划中的个性化记忆模块，说明累积的用户历史如何改变事实表征，以及如何控制这种偏移。
  abstract: >-
    个性化大语言模型会根据用户历史和偏好调整回答，但当用户特定情境与客观事实冲突时，个性化也可能误导事实判断。
    FPPS 将这一问题视为长期用户记忆与事实知识在表征层面的相互影响。论文先定义个性化诱发的幻觉，再分析事实方向与个性化方向在隐藏状态中的纠缠。
    在此基础上，FPPS 判断查询是否存在事实偏移风险，并只调节相关内部表征，从而保留有用的个性化行为，同时避免用户历史覆盖事实。
  method_summary: >-
    FPPS 分为三个步骤。第一步构造个性化事实场景，区分个性化有益与事实受损样本；第二步选择对个性化敏感的层，并训练探针识别事实受损状态；
    第三步在推理时进行自适应调控。个性化与事实严重冲突时，FPPS-H 抑制个性化方向；信号较弱时，FPPS-S 加入事实导向的修正方向。
    干预针对当前表征状态，不会统一移除所有个性化信息。
  story_points:
    - label: "问题"
      title: "个性化也会带来事实风险"
      body: >-
        个性化助手需要记住用户历史，但当用户的信念或偏好与可验证事实冲突时，这份记忆可能使事实回答产生偏差。
    - label: "机制"
      title: "问题不只是提示词污染"
      body: >-
        论文从潜在状态的纠缠解释失效：个性化表征与事实表征可能相互耦合，方向并不正交。
    - label: "干预"
      title: "检测到事实偏移时再进行调控"
      body: >-
        FPPS 先通过层选择和探针判断个性化状态是否存在风险，再定向调整表征，而不是全面取消个性化。
    - label: "证据"
      title: "在更长用户历史和受控模拟中检验方法"
      body: >-
        实验考察用户历史变长时事实性能是否稳定，并在受控教学场景中检验干预效果。
  figures:
    - image: "/images/research/fpps-personalization-case-web.png"
      label: "个性化诱发的幻觉"
      role: "问题"
      source: "Paper Fig. 1; latex/graphs/introduction.pdf"
      layout: "two-column"
      caption: >-
        个性化模型可以更好地回答用户特定问题，但在用户历史与客观事实冲突时，也可能引入事实幻觉。
      details:
        - "这张图呈现论文研究的取舍：答案依赖用户时，个性化有用；用户历史与事实冲突时，个性化会造成伤害。"
        - "需要区分个性化有益样本和事实受损样本。FPPS 保留前者，同时减少后者。"
        - "在整体研究中，这是长时记忆引发的幻觉，问题由用户历史逐渐累积，并非来自单次检索或单步推理。"
    - image: "/images/research/fpps-representation-entanglement.png"
      label: "表征纠缠"
      role: "机制"
      source: "Paper Fig. 2; latex/graphs/empirical.pdf"
      layout: "two-column"
      caption: >-
        个性化方向可能与事实表征不正交，使潜在状态偏向符合用户历史、却不符合事实的回答。
      details:
        - "论文把个性化诱发的幻觉解释为隐藏状态中的几何问题：事实方向与个性化方向没有被清楚分开。"
        - "个性化方向把状态拉离事实方向时，模型可能更符合用户，却更不符合事实。"
        - "事实偏移在最终答案之前已经出现在内部表征中，因此只过滤输出并不能解决问题。"
    - image: "/images/research/fpps-method-framework.png"
      label: "事实保持的个性化调控"
      role: "方法"
      source: "Paper Fig. 4; latex/graphs/methods.pdf"
      layout: "wide"
      caption: >-
        FPPS 定位对个性化敏感的层，探测事实纠缠，并只在发现事实偏移时进行自适应调控。
      details:
        - "阶段 1 使用包含和不包含用户历史的配对输入，选择个性化对事实预测影响最强的模型层。"
        - "阶段 2 在选定层训练轻量探针，区分事实受损状态和个性化有益状态。"
        - "阶段 3 在推理时自适应调控：FPPS-H 抑制有害的个性化方向，FPPS-S 则混入保持事实的修正方向。"
        - "方法只在内部状态显示事实风险时介入，不把所有个性化都当成问题。"
    - image: "/images/research/fpps-history-llama31-8b.png"
      label: "用户历史长度鲁棒性"
      role: "结果"
      source: "Paper Fig. 5a; latex/graphs/history_length/history_length_fscore_LLaMA3.1-8B.pdf"
      layout: "wide"
      caption: >-
        随着用户历史增长，基础个性化模型的事实问答表现下降；FPPS-M 在不同模型骨干上保持了更稳定的事实性能。
      details:
        - "该实验检验更多用户历史进入上下文后，事实可靠性是否继续下降。"
        - "基础模型曲线说明长历史会加重事实偏移，这与个性化具有长时间尺度风险的判断一致。"
        - "FPPS-M 在更强记忆压力下保持事实性，说明表征机制诊断可以直接支持干预。"
    - image: "/images/research/fpps-simulation-result.png"
      label: "受控模拟"
      role: "结果"
      source: "Paper Fig. 6; latex/graphs/simulation_result_fpps.pdf"
      layout: "two-column"
      caption: >-
        受控教学模拟显示个性化如何损害事实知识学习，以及 FPPS-M 如何缓解这种下降。
      details:
        - "模拟环境单独控制个性化教学信号，更容易观察用户历史何时改变事实知识的获得。"
        - "这项结果补充了历史长度实验，用更受控的个性化过程检验机制。"
        - "两组结果共同说明，个性化需要接受监测和调控，不能只追求更强的用户适配。"
  figure_guide:
    - image: "/images/research/fpps-personalization-case-web.png"
      title: "个性化带来的事实取舍"
      role: "问题"
      source: "Paper Fig. 1; latex/graphs/introduction.pdf"
      layout: "two-column"
      summary: "个性化模型更擅长回答用户特定问题，但历史与客观事实冲突时也会产生事实幻觉。"
      reading_guide:
        - "图中区分了个性化有益行为和事实受损行为。"
        - "FPPS 要保留有用的用户适配，同时防止记忆覆盖事实。"
        - "在整体研究中，这对应长时记忆引发的幻觉。"
    - image: "/images/research/fpps-representation-entanglement.png"
      title: "事实方向与个性化方向发生纠缠"
      role: "机制"
      source: "Paper Fig. 2; latex/graphs/empirical.pdf"
      layout: "two-column"
      summary: "个性化方向与事实表征不正交时，潜在状态可能偏向符合用户历史但不可靠的回答。"
      reading_guide:
        - "论文将失效解释为隐藏状态的几何关系，而不只归因于提示词污染。"
        - "个性化把状态拉离事实方向后，事实可靠性可能下降。"
        - "因此，只在输出端过滤并不足够。"
    - image: "/images/research/fpps-method-framework.png"
      title: "事实保持的个性化调控"
      role: "方法"
      source: "Paper Fig. 4; latex/graphs/methods.pdf"
      layout: "wide"
      summary: "FPPS 选择个性化敏感层、探测事实风险，并在推理时自适应调控。"
      reading_guide:
        - "阶段 1 选择个性化对事实预测影响最明显的模型层。"
        - "阶段 2 训练探针，区分事实受损状态与个性化有益状态。"
        - "阶段 3 根据事实偏移程度采用 FPPS-H 或 FPPS-S。"
        - "方法只在需要时干预，不会统一移除个性化信息。"
    - image: "/images/research/fpps-history-llama31-8b.png"
      title: "更长用户历史下的鲁棒性"
      role: "结果"
      source: "Paper Fig. 5a; latex/graphs/history_length/history_length_fscore_LLaMA3.1-8B.pdf"
      layout: "wide"
      summary: "实验检验用户历史增加后，事实可靠性是否继续下降。"
      reading_guide:
        - "更长的历史带来更强的记忆压力，也可能加剧事实偏移。"
        - "对比结果检验 FPPS-M 能否在这种压力下保持事实性。"
        - "图中的变化支持个性化风险会随历史累积的判断。"
    - image: "/images/research/fpps-simulation-result.png"
      title: "受控个性化模拟"
      role: "结果"
      source: "Paper Fig. 6; latex/graphs/simulation_result_fpps.pdf"
      layout: "two-column"
      summary: "模拟实验分离个性化教学信号对事实学习的影响，并检验 FPPS-M 的缓解效果。"
      reading_guide:
        - "该设置比自然用户历史提示更直接地控制个性化过程。"
        - "它与历史长度实验互补，在干扰更少的条件下检验机制。"
        - "两组结果都说明个性化应当受到监测和调控。"
  result_sections:
    - eyebrow: "发现 1"
      title: "个性化提高用户适配时，也可能增加事实风险"
      body: >-
        根据用户历史调整模型可以改善用户特定任务，却可能损害客观事实问答。FPPS 通过区分个性化有益行为与事实受损行为，把这项取舍明确下来。
    - eyebrow: "发现 2"
      title: "失效来自表征纠缠"
      body: >-
        FPPS 将个性化诱发的幻觉视为长时记忆调制效应：用户偏好表征与事实表征发生耦合，在输出之前已经改变事实行为。
    - eyebrow: "发现 3"
      title: "推理时调控可以兼顾事实性与个性化"
      body: >-
        FPPS 先定位个性化敏感层、探测事实风险，再按需调控，从而减少事实偏移，同时保留个性化能力。
  impact: >-
    FPPS 为整体研究加入个性化记忆模块。相比单次 RAG 或单条推理链，它关注更长时间尺度上的问题：累积的用户历史如何改变事实表征和智能体行为。
  citation: |
    @inproceedings{sun2026personalization,
      title={When Personalization Misleads: Understanding and Mitigating Hallucinations in Personalized LLMs},
      author={Sun, Zhongxiang and Zhan, Yi and Shen, Chenglei and Yu, Weijie and Zhang, Xiao and He, Ming and Xu, Jun},
      booktitle={Findings of the Association for Computational Linguistics: ACL 2026},
      pages={8041--8060},
      year={2026}
    }
  homepage_priority: 40
  show_on_homepage: true

- id: rearter
  title: "ReARTeR: Retrieval-Augmented Reasoning with Trustworthy Process Rewarding"
  short_title: "ReARTeR"
  venue: "SIGIR 2025"
  role: "第一作者"
  authors: "Zhongxiang Sun, Qipeng Wang, Weijie Yu, Xiaoxue Zang, Kai Zheng, Jun Xu, Xiao Zhang, Song Yang, Han Li"
  layer: "元认知调控"
  paper_url: "https://arxiv.org/abs/2501.07861"
  project_url: "/zh/ReARTeR_Page/"
  code_url: "https://github.com/Jeryi-Sun/ReARTeR"
  teaser: "/images/research/rearter-teaser.png"
  hero_image: "/images/research/rearter-rartpr-example.png"
  one_liner: "面向可信多步检索增强推理的过程奖励框架。"
  summary: >-
    ReARTeR 从过程层面提高检索增强推理的可靠性。它结合标量过程奖励、与评分对齐的自然语言解释、考虑偏差的前瞻搜索和逐步后训练，
    同时改进中间推理和最终答案。
  research_question: "如何在测试时搜索和后训练过程中，为检索增强推理提供可信的全过程监督？"
  motivation: >-
    最终答案可能结论正确却缺少可靠依据，也可能因为前面的子查询、检索决策或推理步骤出错而失败。
    长程智能体需要在推理过程中得到反馈。
  approach: >-
    ReARTeR 将检索增强推理拆分为中间步骤，用过程奖励信号指导测试时搜索和后训练。
  research_impact: >-
    ReARTeR 为元认知调控提供过程奖励基础，使训练和推理能够观察中间证据使用与推理质量。
  abstract: >-
    检索增强推理系统除了找到有用文档并给出最终答案，还需要保证中间推理可靠。
    ReARTeR 为这类推理引入可信过程奖励，在整个执行过程中评估步骤质量、证据利用和推理一致性。
  method_summary: >-
    ReARTeR 将检索增强推理分解为若干中间步骤，并针对证据利用、步骤有效性和推理一致性给出可信过程反馈。
    方法结合测试时搜索、过程奖励建模与后训练扩展，为后续元认知监测提供可实施的过程奖励基础。
  figures:
    - image: "/images/research/rearter-rartpr-example.png"
      label: "RARTPR 示例"
      role: "问题"
      source: "Paper Fig. 1; samples/graph/intro.pdf"
      layout: "two-column"
      caption: >-
        复杂多步问题需要拆分子查询、自适应检索、逐步推理和过程反馈，单次最终答案判断无法覆盖这些环节。
    - image: "/images/research/rearter-test-time-scaling.png"
      label: "测试时扩展"
      role: "方法"
      source: "Paper Fig. 2; samples/graph/model_graph_1.pdf"
      layout: "wide"
      caption: >-
        ReARTeR 收集过程奖励训练数据，缓解早期步骤偏差，并在测试时搜索中对齐 PEM 解释与 PRM 分数。
    - image: "/images/research/rearter-post-training-scaling.png"
      label: "后训练扩展"
      role: "方法"
      source: "Paper Fig. 3; samples/graph/model_graph_2.pdf"
      layout: "wide"
      caption: >-
        后训练阶段包含预热和逐步离线强化学习，用于改进检索增强推理行为。
  figure_guide:
    - image: "/images/research/rearter-rartpr-example.png"
      title: "为什么最终答案监督过于粗略"
      role: "问题"
      source: "Paper Fig. 1; samples/graph/intro.pdf"
      layout: "two-column"
      summary: "复杂问题需要经过子查询拆分、检索、逐步思考和过程反馈。"
      reading_guide:
        - "可靠性取决于中间步骤，而不只取决于最终答案。"
        - "错误子查询或缺乏证据的推理步骤都可能破坏最终回答。"
        - "因此，监督信号需要进入推理轨迹内部。"
    - image: "/images/research/rearter-test-time-scaling.png"
      title: "在测试时使用过程奖励"
      role: "方法"
      source: "Paper Fig. 2; samples/graph/model_graph_1.pdf"
      layout: "wide"
      summary: "ReARTeR 收集过程奖励数据，并用评估器指导推理路径搜索。"
      reading_guide:
        - "过程奖励模型评估中间检索和推理步骤。"
        - "训练数据偏差修正和解释对齐提高了过程评估的可信度。"
        - "推理过程由步骤质量指导，而不是只按答案似然选择。"
    - image: "/images/research/rearter-post-training-scaling.png"
      title: "利用逐步反馈进行后训练"
      role: "方法"
      source: "Paper Fig. 3; samples/graph/model_graph_2.pdf"
      layout: "wide"
      summary: "预热和逐步离线强化学习把过程反馈转化为更可靠的检索增强推理行为。"
      reading_guide:
        - "这张图连接了过程评估与模型改进。"
        - "逐步反馈为可信的中间行为提供训练信号。"
        - "该方法为智能体监测和修复自身推理过程提供基础。"
  result_sections:
    - eyebrow: "发现 1"
      title: "可信度需要在推理过程中评估"
      body: >-
        最终答案可能结论正确却理由错误，也可能因较早的无依据步骤而失败。ReARTeR 将监督放到中间证据使用和过程质量上。
    - eyebrow: "发现 2"
      title: "过程奖励连接解释与优化"
      body: >-
        逐步反馈既能定位推理过程的失效位置，也能作为训练和后训练目标。
    - eyebrow: "发现 3"
      title: "过程奖励为元认知调控提供基础"
      body: >-
        中间失效变得可见后，智能体才有条件监测、诊断并修复自己的执行过程。
  impact: >-
    ReARTeR 是元认知调控层的过程奖励基础。它把检索增强推理从最终答案任务转化为可监督、可监测、可改进的执行过程。
