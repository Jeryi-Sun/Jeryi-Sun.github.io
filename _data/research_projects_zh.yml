- id: mcm_ds
  title: "Deep Search with Hierarchical Meta-Cognitive Monitoring Inspired by Cognitive Neuroscience"
  short_title: "DS-MCM"
  venue: "SIGIR 2026"
  role: "第一作者"
  authors: "Zhongxiang Sun, Qipeng Wang, Weijie Yu, Jingxuan Yang, Haolang Lu, Jun Xu"
  layer: "元认知调控"
  paper_url: "https://arxiv.org/abs/2601.23188"
  project_url: "/zh/MCM_DS_Page/"
  code_url: "https://github.com/ChangWang9/MC-DSA"
  teaser: "/images/research/mcm-ds-teaser.png"
  hero_image: "/images/research/mcm-ds-hierarchical-monitoring-web.png"
  one_liner: "校准推理不确定性与证据不确定性，并按需触发经验驱动纠错的深度搜索框架。"
  summary: >-
    DS-MCM 将元认知监测引入长程搜索智能体。框架加入快速监测、较慢的反思诊断和经验更新，
    使智能体能够发现异常、分析原因、修正执行，并在后续任务中复用经验。
  research_question: "深度搜索智能体如何在长程任务中监测自身执行、诊断错误并及时修正行为？"
  motivation: >-
    深度搜索智能体需要在不断变化、不完整甚至互相冲突的证据中交替检索和推理。
    要保证执行可靠，系统必须明确监测内部置信度是否与外部证据相匹配。
  approach: >-
    DS-MCM 在深度搜索循环中加入快速一致性监测、经验驱动的慢速诊断、纠正建议和可选的在线记忆整合。
  research_impact: >-
    DS-MCM 对应研究计划中的长程调控层，把机制理解落实为元认知监测、纠错与可复用的控制知识。
  abstract: >-
    深度搜索智能体在部分或冲突证据下持续检索和推理，容易出现长程可靠性问题。
    DS-MCM 引入分层元认知监测，使搜索智能体能够发现异常状态、反思原因、修正执行并更新经验。
  method_summary: >-
    框架在检索、推理、反馈理解和经验更新之上增加监测层。快速一致性监测器发现检索证据不确定性与推理不确定性之间的局部失配；
    较慢的经验驱动监测器进一步诊断原因，决定重新搜索还是重新规划，并把纠正经验保存到后续任务中。
  figures:
    - image: "/images/research/mcm-ds-hierarchical-monitoring-web.png"
      label: "分层元认知监测"
      role: "问题"
      source: "Paper Fig. 1; graphs/introduction.pdf"
      layout: "two-column"
      caption: >-
        论文将人类快速与慢速监测的思路用于深度搜索智能体，并说明常规搜索循环为何缺少发现和纠正认知错误的显式机制。
    - image: "/images/research/mcm-ds-method-framework.png"
      label: "DS-MCM 执行流程"
      role: "方法"
      source: "Paper Fig. 2; graphs/method.pdf"
      layout: "wide"
      caption: >-
        DS-MCM 在 ReAct 式深度搜索循环中加入快速一致性监测器、慢速经验驱动监测器、纠正建议和可选的在线记忆整合。
    - image: "/images/research/mcm-ds-sensitivity-entropy.png"
      label: "敏感性分析"
      role: "结果"
      source: "Paper Fig. 3a; graphs/sensitivity_entropy_threshold.pdf"
      layout: "wide"
      caption: >-
        敏感性实验考察主要超参数，检验监测机制是否依赖某一个固定设置。
  figure_guide:
    - image: "/images/research/mcm-ds-hierarchical-monitoring-web.png"
      title: "为什么深度搜索智能体需要监测"
      role: "问题"
      source: "Paper Fig. 1; graphs/introduction.pdf"
      layout: "two-column"
      summary: "图中把快速与慢速监测思路用于深度搜索智能体，并说明普通搜索循环的不足。"
      reading_guide:
        - "深度搜索智能体在执行中可能偏离目标、误读证据或不断累积矛盾。"
        - "快速监测发现局部不一致，慢速监测负责进一步诊断。"
        - "DS-MCM 位于常规 ReAct 式执行之上，承担元认知调控。"
    - image: "/images/research/mcm-ds-method-framework.png"
      title: "DS-MCM 执行流程"
      role: "方法"
      source: "Paper Fig. 2; graphs/method.pdf"
      layout: "wide"
      summary: "方法加入快速一致性监测、慢速经验驱动监测、纠正建议和可选的在线记忆整合。"
      reading_guide:
        - "快速监测器比较推理不确定性和检索证据不确定性。"
        - "慢速监测器诊断原因，并决定重新搜索、修改当前步骤或重新规划。"
        - "经验更新把一次失败转化为后续任务可以调用的控制知识。"
    - image: "/images/research/mcm-ds-sensitivity-entropy.png"
      title: "检验监测机制的鲁棒性"
      role: "结果"
      source: "Paper Fig. 3a; graphs/sensitivity_entropy_threshold.pdf"
      layout: "wide"
      summary: "敏感性分析检查监测机制是否依赖脆弱的单一超参数设置。"
      reading_guide:
        - "实验给出 DS-MCM 在不同运行设置下的表现。"
        - "图中的变化说明哪些参数会影响监测行为。"
        - "该结果把元认知设计与实际运行稳定性联系起来。"
  result_sections:
    - eyebrow: "发现 1"
      title: "长程搜索需要持续监测执行过程"
      body: >-
        搜索智能体可能在执行中偏离目标、证据不足、误读反馈或积累矛盾，最后仍给出很有把握的回答。因此，控制必须进入过程内部。
    - eyebrow: "发现 2"
      title: "快速监测与慢速反思分别承担发现和诊断"
      body: >-
        DS-MCM 将局部异常检测和经验支持的原因诊断分开，使智能体可以正常继续，也可以在需要时修改后续执行。
    - eyebrow: "发现 3"
      title: "经验更新形成可复用的控制知识"
      body: >-
        框架使智能体从被动生成下一步，转向评估自身状态、纠正当前执行，并在后续任务中使用已有经验。
  impact: >-
    DS-MCM 是整体研究中的长程调控层。它把“智能体应监测自身状态、诊断失效原因并主动纠正执行”落实为可运行的方法。
