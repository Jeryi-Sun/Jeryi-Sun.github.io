    insights:
      - "在十组生成器与数据集的 ACC-L 比较中，ReARTeR 全部超过 CR-Planner。"
      - "相对 Standard RAG，GPT-4o-mini 的平均 ACC-L 提高 14.5 个百分点，LLaMA3.1-8B 提高 13.2 个百分点。"
      - "两种生成器上的结果共同反映了过程评分、解释引导修正和后训练的作用。"
  research_impact:
    - >-
      ReARTeR 为元认知调控提供过程奖励基础，把检索增强推理从最终答案任务改造成可以逐步监督的执行过程。
    - >-
      可靠智能体需要评价中间行为的奖励信号。ReARTeR 在检索增强推理中提供了这一层，使后续监控、反思和纠错能够落到具体步骤。

- id: mcm_ds
  research_question:
    - >-
      DS-MCM 研究深度搜索智能体如何在长程任务中监控自身执行、诊断错误，并及时调整行为。随着证据不断变化，智能体需要持续校准
      推理状态和检索状态。
    - >-
      深度搜索本质上也是控制问题。智能体要判断内部推理的不确定性是否与检索证据的不确定性相称，并识别当前步骤是否类似过去的
      成功或失败经历。
    - >-
      项目因此在普通行动与观察之上加入元认知监测层，用来发现异常状态、归因故障、提出修正，并把执行经验保存给后续任务。
  motivation:
    - >-
      常规搜索或 ReAct 循环可以持续行动、观察再行动，却没有专门检查执行是否可靠。证据含糊时，智能体可能仍然过度自信；证据一致时，
      它也可能保持不必要的高不确定性。
    - >-
      长程任务中的许多错误在过程中逐步形成。智能体需要在线信号发现推理与检索何时失配，也需要利用已有经验指导接下来的步骤。
    - >-
      DS-MCM 借鉴认知神经科学中的分层监控：快速局部检查负责捕捉即时的不一致，较慢的反思过程解释故障原因，并给出轨迹调整建议。
  approach:
    - >-
      框架在深度搜索循环外增加分层监控。快速监控器检查推理不确定性与证据不确定性的局部一致性，以较低代价判断当前状态是否异常。
    - >-
      较慢的经验驱动监控器从成功和失败记忆中检索相似会话。批判模型比较历史经验与当前步骤，识别认知错误模式，并向后续执行发出修正建议。
    - >-
      DS-MCM 还支持可选的在线记忆整合。新的监控经验经过去重后保存，成为以后任务可以复用的控制知识。
    - >-
      在整体研究中，DS-MCM 对应长程调控层。它把自我监控和调节落实到智能体逐步生成下一行动的过程中。
  key_findings:
    - eyebrow: "发现 1"
      title: "快速监控把推理不确定性与证据状态对齐"
      paragraphs:
        - >-
          Searching Entropy 描述检索文档的语义分散程度，Reasoning Entropy 描述模型推理 token 的不确定性。成功轨迹用来估计两者的正常关系。
        - >-
          快速监控器检查实际 Reasoning Entropy 与期望值的残差，既能发现证据一致时的异常犹豫，也能发现证据含糊时的过度自信。
    - eyebrow: "发现 2"
      title: "慢速监控利用成功与失败记忆进行诊断"
      paragraphs:
        - >-
          慢速监控器分别从成功记忆池和失败记忆池中检索相似会话，为批判模型提供与当前步骤直接相关的行为参照。
        - >-
          模型据此判断是否出错并生成修正建议，建议随后进入智能体下一步行动的上下文。
    - eyebrow: "发现 3"
      title: "选择性触发把检测连接到控制"
      paragraphs:
        - >-
          快速监控器每一步运行；只有不确定性校准异常时，成本更高的慢速批判过程才会启动。轻量检测与深度反思因此分工明确。
        - >-
          修正建议会直接加入下一步策略上下文，监控结果由此改变后续执行，而不是停留在事后记录。
    - eyebrow: "发现 4"
      title: "分层监控提高深度搜索的稳健性"
      paragraphs:
        - >-
          在多个深度搜索基准和骨干模型上，DS-MCM 都提高了表现。敏感性实验进一步检查熵阈值、检索记忆条数和文档预算。
        - >-
          可选的在线记忆整合使有效监控经验能够跨任务保留，并在之后的搜索过程中再次使用。
  narrative_sections:
    - figure: "/images/research/mcm-ds-hierarchical-monitoring-web.png"
      title: "深度搜索为什么需要元认知监测"
      role: "Problem"
      source: "Paper Fig. 1; graphs/introduction.pdf"
      layout: "two-column"
      summary: "图中依次比较人类的分层元认知监测、缺少监控并最终出错的普通深度搜索智能体，以及加入 MCM 后的搜索智能体。"
      paragraphs:
        - >-
          顶部把人类监控映射到执行过程：与 ACC 相关的快速监控器负责低成本异常检测，并选择性触发慢速监控；后者与 PFC 和海马体相关，
          通过记忆进行显式反思。执行则从任务开始，经过多个步骤，直到完成。
        - >-
          中间一行是普通深度搜索智能体的故障路径：问题、工具调用、推理、重复执行，最后产生错误。底部加入 MCM。在图示的失踪 16 岁少年
          查询中，系统经过工具与推理步骤后识别出“没有理解问题”的故障，触发重新思考，随后得到修正结果。
      reading_guide:
        - "顶部根据 ACC 与 PFC+hippocampus 的标注，区分快速异常检测和慢速反思。"
        - "中间的普通搜索循环虽然有工具和推理模块，却没有明确的纠错节点。"
        - "底部 MCM 在最终回答前加入问题理解诊断和重新思考。"
    - figure: "/images/research/mcm-ds-method-framework.png"
      title: "DS-MCM 的执行与监控流程"
      role: "Method"
      source: "Paper Fig. 2; graphs/method.pdf"
      layout: "wide"
      summary: "方法图完整画出 ReAct 式执行循环、快速一致性监控器、慢速经验驱动监控器和记忆更新。"
      paragraphs:
        - >-
          顶部执行流程从用户问题 q 开始。步骤 s_t 交替产生检索动作、文档集 D_t、语义簇 C_t、推理轨迹和 token 分布 p_r，
          再计算 Searching Entropy SE_t 与 Reasoning Entropy RE_t，送入快速一致性监控器。
        - >-
          黄色监控框根据 Searching Entropy 校准期望的 Reasoning Entropy，计算 epsilon_t；当 |epsilon_t| 超过阈值 tau 时触发慢速监控。
          下方蓝色区域由历史轨迹构造记忆，分别检索成功与失败经验，通过批判模型 C 生成修正建议 delta_t 或错误标记 err_t，最后再去重并更新记忆。
      reading_guide:
        - "SE_t 来自检索证据，RE_t 来自推理 token 分布。"
        - "快速监控器根据校准后的熵失配判断当前步骤是一致还是偏离。"
        - "慢速监控器把成功、失败经验转成修正建议，并把新经验写回记忆。"
    - title: "监控机制的稳健性检查"
      role: "Results"
      toc_label: "敏感性分析"
      source: "Paper Fig. 3; graphs/sensitivity_entropy_threshold.pdf + graphs/sensitivity_memory_retrieved.pdf + graphs/sensitivity_retrieved_docs.pdf"
      layout: "wide"
      panel_layout: "three"
      summary: "三幅图分别考察准确率随熵阈值 k、检索记忆数量 |R| 和检索文档 top-K 的变化。"
      panels:
        - image: "/images/research/mcm-ds-sensitivity-entropy.png"
          label: "(a) 熵阈值 k"
          source: "graphs/sensitivity_entropy_threshold.pdf"
        - image: "/images/research/mcm-ds-sensitivity-memory.png"
          label: "(b) 检索监控记忆数量 |R|"
          source: "graphs/sensitivity_memory_retrieved.pdf"
        - image: "/images/research/mcm-ds-sensitivity-docs.png"
          label: "(c) 检索文档 top-K"
          source: "graphs/sensitivity_retrieved_docs.pdf"
      paragraphs:
        - >-
          (a) 改变熵阈值 k，(b) 改变检索记忆条数 |R|，(c) 改变检索文档数量 top-K。三个子图中，蓝色 Tongyi-Deepresearch
          曲线都明显高于紫色虚线 Mirothinker-Deepresearch 曲线。
        - >-
          最优设置并不总在最大取值处：蓝色曲线在中等 k 和 |R| 附近达到峰值，(c) 也在中等 top-K 附近最高。
          这说明触发阈值和检索预算本身就是监控机制的一部分，需要在灵敏度与噪声之间取平衡。
      reading_guide:
        - "(a) 用熵阈值 k 检查快速监控器的触发灵敏度。"
        - "(b) 检查慢速监控需要检索多少条历史经验。"
        - "(c) 用 top-K 文档数量检查证据检索预算。"
  main_results:
    title: "主要实验结果"
    summary: >-
      DS-MCM 使用三个开源骨干模型，在四个深度搜索基准上评估。表中比较原始系统、LLM-as-Critic 基线和 DS-MCM；GPT-5 仅作为
      论文中报告的专有系统参照。
    tables:
      - title: "深度搜索基准准确率（%）"
        note: "星号表示论文主表中报告为具有统计显著性的 DS-MCM 提升。"
        columns: ["系统", "BrowseComp+", "BrowseComp-ZH", "X-Bench", "GAIA", "平均值"]
        rows:
          - cells: ["GPT-5（参照）", "70.0", "34.3", "75.0", "62.8", "60.5"]
          - cells: ["Tongyi-DR", "51.0", "38.0", "69.0", "70.1", "57.0"]
          - cells: ["Tongyi-DR + Critic", "55.0", "42.0", "68.0", "69.3", "58.6"]
          - cells: ["Tongyi-DR + DS-MCM", "62.0*", "45.0*", "74.0*", "71.7", "63.2*"]
            highlight: true
          - cells: ["MiroThinker-DR", "21.0", "31.0", "62.0", "63.8", "44.5"]
          - cells: ["MiroThinker-DR + Critic", "24.0", "30.0", "64.0", "63.0", "45.2"]
          - cells: ["MiroThinker-DR + DS-MCM", "26.0", "34.0*", "68.0*", "69.3*", "49.3*"]
            highlight: true
          - cells: ["Qwen3-30B-MoE", "5.0", "21.0", "42.0", "40.9", "27.2"]
          - cells: ["Qwen3-30B-MoE + Critic", "22.0", "27.0", "47.0", "43.3", "34.8"]
          - cells: ["Qwen3-30B-MoE + DS-MCM", "29.0*", "35.0*", "53.0*", "47.2*", "41.1*"]
            highlight: true
    insights:
      - "相对原始骨干，DS-MCM 的平均分在 Tongyi-DR 上提高 6.2 分，在 MiroThinker-DR 上提高 4.8 分，在 Qwen3-30B-MoE 上提高 13.9 分。"
      - "三个骨干模型上，DS-MCM 都超过通用 LLM-as-Critic，说明显式的快慢监控比单纯增加批评调用更有效。"
      - "Tongyi-DR + DS-MCM 的平均分为 63.2，比表中 GPT-5 参照结果高 2.7 分。"
  research_impact:
    - >-
      DS-MCM 是当前项目序列中的元认知调控环节。ReDeEP 分析证据使用，RHD 分析推理动态，ReARTeR 构造过程奖励，
      DS-MCM 再把这些思路接入监控与纠错循环。
    - >-
      下一步需要让智能体能够检查自己的执行状态。科研、法律和决策支持中的智能体自主性越高，越需要这样一层过程监控来约束长程行为。
