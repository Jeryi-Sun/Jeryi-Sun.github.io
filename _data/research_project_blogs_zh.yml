      - "PAG、DPL、RAG 和 LLM-TRSR 上方向一致，说明 FPPS 是通用的推理时控制层，并不依赖某一种个性化方法。"
  research_impact:
    - >-
      FPPS 把个性化记忆模块纳入“AI 智能体认知神经科学”研究，分析累积的用户历史怎样逐步改变内部表征和事实行为。
    - >-
      长期助手、推荐智能体、法律智能体和科研智能体都需要记忆。它们也必须判断记忆何时应影响回答，何时应让可核验事实占主导。

- id: rearter
  research_question:
    - >-
      ReARTeR 研究如何在检索增强推理的整个过程中提供可信监督。一个复杂答案可能依赖子问题拆解、检索时机、证据选择、
      中间推理和最终综合，任一环节都可能改变结果。
    - >-
      项目聚焦过程层：能否评价每个中间步骤的质量和可信度，让系统据此搜索更好的推理路径，并通过步骤级反馈继续学习？
    - >-
      这对智能体搜索很重要。智能体一边检索一边推理时，应当在决定检索什么、怎样使用证据、当前步骤有没有依据时就获得反馈，
      而不是等最终答案产生后再统一评分。
  motivation:
    - >-
      最终答案监督无法细致描述多步检索增强推理。正确答案也可能来自缺乏依据的路径；错误答案则可能只源于很早的一次检索或分解失误。
    - >-
      检索与推理交替进行时，可靠性取决于整条路径。错误子问题会带来无关证据，薄弱的证据判断会误导下一步，缺少支持的中间结论
      还会污染最终综合。
    - >-
      ReARTeR 希望过程奖励既能用于优化，也能给出可读解释。单一黑盒分数无法说明步骤为什么可靠或哪里出了问题，修正环节需要更具体的反馈。
  approach:
    - >-
      ReARTeR 用过程奖励模型 PRM 给步骤打分，用过程解释模型 PEM 生成自然语言批评和改写建议。平衡蒙特卡洛标注，并在困难样本上引入
      更强生成器，可以改善 PRM 的训练数据。
    - >-
      测试时，基于时序差分的前瞻策略减少 PRM 对早期步骤的偏差。离策略偏好学习把 PEM 解释与 PRM 分数对齐，使低质量步骤能根据
      可解释反馈得到修正，同时让搜索选择更好的候选路径。
    - >-
      后训练阶段用 PRM 引导蒙特卡洛树搜索，收集步骤级偏好数据，再通过 KTO 进行迭代式离线优化，让过程质量进入生成器学到的行为。
    - >-
      在整体研究中，ReARTeR 把诊断信号转化为监督。ReDeEP 和 RHD 分别识别内部路径与时间动态中的故障，ReARTeR 则研究如何在执行中
      奖励模型避开这些故障。
  key_findings:
    - eyebrow: "发现 1"
      title: "平衡标注改善了过程奖励数据"
      paragraphs:
        - >-
          常规蒙特卡洛标注容易产生偏斜标签，在困难问题上给出的监督也较弱。ReARTeR 平衡正负过程样本，并在普通 rollout 失效时使用
          更强生成器。
        - >-
          这样得到的训练数据更有区分度，PRM 可以更好地判断检索增强推理路径中的具体步骤。
    - eyebrow: "发现 2"
      title: "前瞻评分与对齐解释改善步骤修正"
      paragraphs:
        - >-
          PRM 很难只凭局部信息准确判断搜索树中的浅层节点。基于 TD 的前瞻评分利用后续路径信息，降低这种早期步骤偏差。
        - >-
          PEM 与 PRM 对齐后，模型既得到数值分数，也得到更可能改善薄弱步骤的解释，测试时搜索因此拥有可执行的修正依据。
    - eyebrow: "发现 3"
      title: "过程奖励同时支持测试时与后训练扩展"
      paragraphs:
        - >-
          测试时，过程奖励引导候选路径搜索和步骤改写；后训练时，同一套奖励机制引导 MCTS 收集步骤级偏好数据。
        - >-
          多个多跳推理数据集上的准确率随强化微调迭代提升，说明训练流程确实带来了可测量的扩展效果。
    - eyebrow: "发现 4"
      title: "PEM 与 PRM 对齐会影响下游结果"
      paragraphs:
        - >-
          把 PEM 解释与 PRM 分数对齐后，解释引导的改写更容易提高过程奖励，最终任务准确率也随之上升。
        - >-
          这套过程反馈也为 DS-MCM 提供了基础。后者要实施监控和纠错，必须先有可信的中间状态评价信号。
  narrative_sections:
    - figure: "/images/research/rearter-rartpr-example.png"
      title: "最终答案监督为什么不够"
      role: "Problem"
      source: "Paper Fig. 1; samples/graph/intro.pdf"
      layout: "two-column"
      summary: "案例围绕 X.com 问题，串联生成步骤、检索结果、前瞻搜索、PRM 评分和 PEM 修正。"
      paragraphs:
        - >-
          左侧给出一条具体过程轨迹。生成器先询问 Elon Musk 在 1999 年创办的公司并自适应检索；检索器返回证据，说明 X.com 是由
          Ed Ho、Harris Fricker、Elon Musk 等人创办的网上银行。下一步询问 X.com 现在的名称，检索结果说明它与 Confinity 合并后
          改名为 PayPal。
        - >-
          右侧解释为什么这条轨迹需要过程监督。候选步骤组成搜索树，经过前瞻搜索、rollout 和回传；PRM 给出 0.3、0.4、0.2 等过程分数，
          PEM 则根据问题分解、检索和答案生成中的错误说明来改写步骤。底部图例把过程分成子问题、检索和推理三类行为。
      reading_guide:
        - "左侧轨迹表明，检索增强推理是一连串生成器与检索器决策。"
        - "右侧树表示中间步骤可能形成的候选搜索空间。"
        - "PRM 分数用于选择路径，PEM 解释说明当前步骤需要修正哪一种过程错误。"
    - figure: "/images/research/rearter-test-time-scaling.png"
      title: "测试时的过程奖励"
      role: "Method"
      toc_label: "测试时扩展"
      source: "Paper Fig. 2; samples/graph/model_graph_1.pdf"
      layout: "wide"
      summary: "图中依次给出 PRM 数据收集、早期步骤偏差修正，以及 PEM 与 PRM 对齐。"
      paragraphs:
        - >-
          (a) 说明 PRM 训练数据的收集过程。多次 rollout e1、e2、e3 生成候选答案 a1、a2、a3，蒙特卡洛正确率 MC 决定系统是否要调用
          更强生成器、使用 OmegaPRM 收集数据，或调整样本以维持分布平衡。
        - >-
          (b) 给出偏差修正的动机：浅层节点的 PRM 偏差可能高于深层节点，偏差修正分数用于减弱这种早期偏好。(c) 对齐 PRM 与 PEM：
          PRM 为步骤给出 r1、r2，PEM 生成解释 c1，并依据 r2 是否大于 r1 构造正负样本。
      reading_guide:
        - "(a) 根据 rollout 正确性收集偏差更小、分布更平衡的 PRM 数据。"
        - "(b) 说明前瞻搜索为何要修正对浅层节点的偏好。"
        - "(c) 把 PRM 数值奖励与 PEM 解释联系起来，使过程分数更容易用于具体修正。"
    - figure: "/images/research/rearter-post-training-scaling.png"
      title: "用步骤级反馈进行后训练"
      role: "Method"
      toc_label: "后训练扩展"
      source: "Paper Fig. 3; samples/graph/model_graph_2.pdf"
      layout: "wide"
      summary: "后训练图包括强生成器提供的 warm-up 数据，以及在选中搜索树路径上进行的步骤级离线强化学习。"
      paragraphs:
        - >-
          左侧由强生成器采样推理数据，较弱生成器先接受 SFT warm-up。中间随后运行交互式推理：从搜索树选择节点 0，通过二分搜索扩展
          候选节点，再用 PRM 和 PEM 修正所选路径。
        - >-
          底部更新流程把带有 +1、-1 标签的路径片段整理为步骤级离线强化学习数据。右侧得到推理微调后的生成器。过程奖励因此既能在
          推理时排序路径，也能直接改善生成器。
      reading_guide:
        - "强生成器提供 warm-up 数据，较弱生成器先经 SFT 再进入强化学习。"
        - "被选择的树节点会转成带标签的步骤级训练序列。"
        - "PRM 和 PEM 位于训练闭环内部，不只是训练结束后的外部评价器。"
    - title: "不同检索增强推理数据集上的后训练扩展"
      role: "Results"
      toc_label: "迭代结果"
      source: "Paper Fig. 4; samples/graph/*_rft.pdf"
      layout: "wide"
      panel_layout: "four-inline"
      summary: "四条迭代曲线分别给出 2WikiMultiHopQA、Bamboogle、HotpotQA 和 Musique 上的准确率变化。"
      panels:
        - image: "/images/research/rearter-rft-2wiki.png"
          label: "2WikiMultiHopQA"
          source: "samples/graph/2WikiMultiHopQA_rft.pdf"
        - image: "/images/research/rearter-rft-bamboogle.png"
          label: "Bamboogle"
          source: "samples/graph/Bamboogle_rft.pdf"
        - image: "/images/research/rearter-rft-hotpotqa.png"
          label: "HotpotQA"
          source: "samples/graph/HotpotQA_rft.pdf"
        - image: "/images/research/rearter-rft-musique.png"
          label: "Musique"
          source: "samples/graph/Musique_rft.pdf"
      paragraphs:
        - >-
          每幅图跟踪强化微调迭代中的表现变化。与只报告一项最终结果相比，曲线可以直接观察训练收益如何形成。
        - >-
          分数据集展示还能看出过程奖励训练在哪些任务上较稳定，哪些任务的收益更依赖具体设置。这组结果把图 3 中的步骤级离线 RL
          闭环对应到多跳推理基准上的实际行为。
      reading_guide:
        - "每幅图是一种数据集上的后训练迭代轨迹。"
        - "这里需要同时比较曲线形状和最终高度，因为图的主题是训练过程中的扩展行为。"
        - "这组实验是图 3 后训练流程的实证结果。"
    - title: "PEM 与 PRM 对齐的效果"
      role: "Results"
      toc_label: "解释对齐"
      source: "Paper Fig. 5; samples/graph/Improvement_Rate_BarChart.pdf + samples/graph/ACC_L_BarChart.pdf"
      layout: "wide"
      panel_layout: "two"
      summary: "两个柱图检验过程解释与奖励分数对齐后，是否能改善推理路径修正。"
      panels:
        - image: "/images/research/rearter-pem-improvement.png"
          label: "PEM 引导改写后的提升率"
          source: "samples/graph/Improvement_Rate_BarChart.pdf"
        - image: "/images/research/rearter-pem-acc.png"
          label: "PEM 与 PRM 对齐后的准确率"
          source: "samples/graph/ACC_L_BarChart.pdf"
      paragraphs:
        - >-
          左图询问解释能否修复薄弱的中间步骤，右图继续检查这种解释引导的修正是否改善最终检索增强推理结果。两幅图单独检验了
          PEM/PRM 对齐的作用。
        - >-
          ReARTeR 不只给出一个过程分数，还把解释放进纠错闭环。因而，这里的实验证据直接关系到解释是否真的带来可测量改善。
      reading_guide:
        - "左图把 PEM 读作低质量步骤的修正机制。"
        - "右图把解释对齐重新连接到最终任务表现。"
        - "两图说明，数值过程奖励配合与其一致的自然语言解释后，更容易转化为有效修正。"
  main_results:
    title: "主要实验结果"
    summary: >-
      ReARTeR 分别在专有生成器的测试时扩展，以及开源生成器的测试时加后训练扩展下评估。表中报告 ACC-L，即由 GPT-4o 判断的答案
      准确率，并比较 Standard RAG、测试时最强基线 CR-Planner 与 ReARTeR。
