        note: "Overall 是论文联合衡量事实性和个性化的指标；Base 与 +M 分别表示原个性化系统和加入 FPPS-M 的版本。"
        columns: ["个性化方法", "LLaMA Base", "LLaMA +M", "Qwen-7B Base", "Qwen-7B +M", "Qwen-14B Base", "Qwen-14B +M"]
