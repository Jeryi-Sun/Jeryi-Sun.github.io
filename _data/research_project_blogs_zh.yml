- id: redeep
  research_question:
    - >-
      ReDeEP 从检索增强生成中的一个常见问题出发：系统明明检索到了相关证据，模型为什么仍会产生幻觉？不少 RAG
      失败并非文档链路彻底失效。正确或有用的材料已经进入提示词，最终回答却仍然跟随了没有依据的说法。
    - >-
      因此，我们把“检索成功”和“证据使用”分开考察。前者描述外部系统是否把有用文档带入上下文；后者关注模型内部
      是否真的依据外部证据生成，还是退回参数知识，给出表面流畅却缺少支持的回答。
    - >-
      ReDeEP 研究回答形成过程中外部上下文与参数知识如何竞争。放在 AI 智能体中看，它对应的是工具返回证据之后，
      模型究竟如何使用这些证据。
  motivation:
    - >-
      检索常被视为抑制幻觉的直接办法。模型能够搜索文档、查询数据库或接收工具输出，回答似乎就应当更有依据。
      问题在于，外部证据进入上下文以后，还需要经过模型内部计算才能影响生成。
    - >-
      这对智能体尤其实际。智能体调用了正确的搜索引擎、读到了法规原文或拿到了数据库记录，并不等于它会在正确时刻
      依赖这些信息。流畅的答案可能掩盖证据被忽略，也可能掩盖模型在冲突中转而采用证据更弱的内部先验。
    - >-
      只看输出的检测器会把这些情况混在一起。它可以判断回答缺少支持，却难以区分检索错误、外部证据利用不足、参数知识
      过强，还是两条信息路径发生冲突。ReDeEP 把分析移到模型内部，以便分别观察这些来源。
  approach:
    - >-
      方法把生成看作两条信息路径的竞争。外部上下文路径把检索文档中的信息送入回答；参数知识路径反映模型权重中存储的
      信息。模型已经看到外部证据，却在内部依赖了错误来源时，幻觉风险就会上升。
    - >-
      ReDeEP 为这场竞争构造机制信号，比较忠实生成与幻觉生成中的注意力、复制行为、前馈网络计算和残差流状态，进而估计
      外部上下文使用程度与参数知识依赖程度。
    - >-
      检测器不只在最终文本上学习分类，而是把两条路径的失衡作为中间诊断信号。若模型没有充分利用外部证据，系统可以
      标记风险、重新检索，或把生成方向拉回检索上下文。
    - >-
      在我的整体研究中，ReDeEP 是“模块定位”的第一个具体例子。它聚焦检索后的证据使用模块，追问故障在哪里形成、
      哪些内部信号能够暴露故障，以及这些信号能否支持干预。
  key_findings:
    - eyebrow: "发现 1"
      title: "检索成功之后仍会发生 RAG 幻觉"
      paragraphs:
        - >-
          证据链路正常并不能保证模型回答正确。文档里可能已经写出答案，模型却继续依赖内部信念、记忆关联或没有证据支持的先验。
        - >-
          因而，RAG 幻觉也涉及信息源选择。检测时既要确认证据是否存在，也要测量内部计算究竟赋予了证据多大作用。
    - eyebrow: "发现 2"
      title: "忠实生成与幻觉生成采用了不同的信息路径"
      paragraphs:
        - >-
          两类生成的差别不只出现在最终文本中。它们利用检索上下文和参数知识的方式也不同。路径级分数因此能够揭示回答对
          不同信息源的隐性依赖。
        - >-
          诊断也随之更具体：模型是忽略了证据，过度依赖内部知识，还是没有处理好两者冲突？这些问题比单纯贴上“幻觉”标签更有用。
    - eyebrow: "发现 3"
      title: "机制检测可以直接指向干预"
      paragraphs:
        - >-
          这些信号对应具体内部机制，因此可以用于事后分类以外的环节。高风险的路径失衡可以触发证据复核、再次检索，或引导模型
          增强对外部上下文的利用。
        - >-
          普通分类器只报告结果，机制检测还说明答案是如何形成的。知道故障来自哪条路径，才有可能选择合适的修正方式。
    - eyebrow: "发现 4"
      title: "工具调用之后还需要内部审计"
      paragraphs:
        - >-
          工具接口返回正确结果，智能体内部仍可能失败。真正需要检查的是返回证据有没有进入后续推理并控制生成。
        - >-
          这个问题也引出了后续的过程奖励和元认知监测：可靠的智能体需要审计工具调用，并确认返回信息确实影响了推理过程。
  narrative_sections:
    - figure: "/images/research/redeep-problem-conflict.png"
      title: "证据已经出现，模型却没有使用"
      role: "Problem"
      source: "Paper Fig. 1; graphs/introduction.pdf"
      layout: "wide"
      summary: "图中对比了忠实回答的嫦娥六号案例，以及检索证据与参数知识冲突后出现幻觉的超声检查案例。"
      paragraphs:
        - >-
          左侧是一次成功的 RAG。检索文档给出嫦娥六号带回 1935.3 克月球样品，问题询问样品重量，回答复述同一数值并被判为正确。
          检索文档、问题、模型和答案在这里保持一致。
        - >-
          右侧正是 ReDeEP 要处理的失败。检索文档说优质超声图像最适合在孕期 20 至 32 周获取，紫色参数知识框给出 24 至 32 周，
          最终回答又混入 17 周的条件并被标为幻觉。证据虽然在上下文中，却没有真正控制回答。
      reading_guide:
        - "左例中，绿色检索文档框和黄色回答框的关键数值都是 1935.3 克。"
        - "右例中，检索文档写的是 20–32 周，参数知识框写的是 24–32 周，回答没有稳定遵循任何一方。"
        - "这张图提出 ReDeEP 的核心诊断问题：检索完成以后，哪一种信息源真正控制了生成？"
    - figure: "/images/research/redeep-causal-framing.png"
      title: "RAG 中的两条信息路径"
      role: "Mechanism"
      source: "Paper Fig. 2; graphs/related_work.pdf"
      layout: "wide"
      summary: "图中用 E 表示外部上下文、P 表示参数知识、H 表示回答是否产生幻觉，并据此刻画 RAG 幻觉。"
      paragraphs:
        - >-
          左侧紫色部分对应参数知识 P 被外部证据 E 混杂的检测设定；中间绿色部分是相反情形，即外部证据 E 被参数知识 P 混杂；
          下方中间图表示 P 与 E 共同影响 H 的混合设定。
        - >-
          右侧蓝色的“Decouple & Regression”给出本文的处理方式：拆开 P 与 E，使一个来源不会遮蔽另一个来源的作用。
          图中把已有方法放在相应的混杂设定下，把解耦后的因果图留给 ReDeEP。
      reading_guide:
        - "E 是检索得到的外部上下文，P 是参数知识，H 表示回答是否发生幻觉。"
        - "三个因果图说明，只把幻觉归因于单一信息源，检测结果可能受到另一来源的混杂。"
        - "最右侧的解耦步骤分别估计 E 和 P 的作用，这是 ReDeEP 与已有方法的主要区别。"
    - figure: "/images/research/redeep-method.png"
      title: "把证据使用转化为可计算信号"
      role: "Method"
      source: "Paper Fig. 3; graphs/method.pdf"
      layout: "wide"
      summary: "方法图说明如何根据注意力、隐藏状态、LogitLens 以及 FFN 前后的残差变化计算外部上下文分数和参数知识分数。"
      paragraphs:
        - >-
          左侧计算外部上下文分数。步骤 1 根据注意力权重找出受到关注的证据 token；步骤 2 对这些 token 的隐藏状态做平均池化，
          再计算余弦相似度，得到具体层和注意力头位置上的外部上下文信号。
        - >-
          右侧计算参数知识分数。图中既把末层隐藏状态送入反嵌入矩阵，也通过 LogitLens、softmax 和 JSD 比较 FFN 前后的残差流。
          因而，ReDeEP 同时测量了证据注意和 FFN 注入的参数知识。
      reading_guide:
        - "沿左侧橙色箭头阅读，可以看到被注意的证据 token 如何形成 External Context Score。"
        - "沿右侧蓝框中的 LogitLens/JSD 计算阅读，可以看到 FFN 前后的变化如何形成 Parametric Knowledge Score。"
        - "这里评分的是模型内部的信息路由，不是回答文本本身。"
    - figure: "/images/research/redeep-ecs-pks-results.png"
      title: "两条信息路径的内部证据"
      role: "Results"
      toc_label: "机制证据"
      source: "Paper Fig. 4; graphs/empirical_study_1.pdf"
      layout: "wide"
      summary: "结果图汇集外部上下文热图、复制头热图和参数知识层级柱图，用来检验两条路径的机制假设。"
      paragraphs:
        - >-
          (a) 与 (b) 是跨层、跨注意力头的外部上下文热图。(a) 比较忠实生成与幻觉生成的分数差，(b) 给出分数与反向幻觉标签的
          Pearson 相关性；(c) 单独画出各层各头的复制头分数。
        - >-
          (d) 与 (e) 转向参数知识。(d) 按层给出“幻觉减忠实”的分数差，并标出平均值虚线；(e) 报告参数知识分数与幻觉标签的
          Pearson 相关性。五个子图与方法图一一对应：外部证据利用和参数知识依赖都能测量，并且在两类生成中表现不同。
      reading_guide:
        - "(a)–(c) 是分布在层和注意力头上的证据侧诊断。"
        - "(d)–(e) 是分布在层上的知识侧诊断。"
        - "这组结果回应图 3：由内部组件计算出的分数能够区分幻觉生成和忠实生成。"
    - title: "因果干预与已知/未知知识状态"
      role: "Results"
      toc_label: "因果干预"
      source: "Paper Fig. 5; graphs/intervene_combined_result.pdf + graphs/parametric_know_unknow_socre.pdf"
      layout: "wide"
      panel_layout: "two"
      summary: "左图检验复制头与知识 FFN 是否会因果性地影响幻觉，右图比较模型已知和未知答案时的外部上下文及参数知识分数。"
      panels:
        - image: "/images/research/redeep-intervention-result.png"
          label: "对注意力头和 FFN 的干预"
          source: "graphs/intervene_combined_result.pdf"
        - image: "/images/research/redeep-known-unknown-scores.png"
          label: "已知真值与未知答案幻觉的分数比较"
          source: "graphs/parametric_know_unknow_socre.pdf"
      paragraphs:
        - >-
          左图是因果检验。干预注意力头和 FFN 后，损失按预期方向变化，说明这些组件与 RAG 幻觉的关系不只是相关性。
        - >-
          右图把模型知道真实答案的样本，与模型不知道答案并产生幻觉的样本分开。这个比较仍然围绕信息源竞争：生成是否忠实，
          会伴随外部上下文使用程度和参数知识依赖程度的变化。
      reading_guide:
        - "左图把 Copying Heads 和 Knowledge FFNs 读作可干预的因果环节，而非一般诊断特征。"
        - "右图把内部机制与模型是否具有可靠参数知识联系起来。"
        - "两图共同支持 AARF 的干预思路：保留注意力侧证据，同时减少 FFN 过量注入参数知识。"
  main_results:
    title: "主要实验结果"
    summary: >-
      ReDeEP 在 RAGTruth 和 Dolly (AC) 上作为 RAG 幻觉检测器进行评估。为便于阅读，表中列出各指标最强的非 ReDeEP 结果，
      并与主表中表现最稳定的 ReDeEP (chunk) 比较。
    tables:
      - title: "RAG 幻觉检测"
        note: "指标取值范围为 0–1；“最佳基线”表示原论文表格中该列最好的非 ReDeEP 结果。"
        columns: ["骨干模型", "方法", "RAGTruth AUC", "RAGTruth F1", "Dolly AUC", "Dolly F1"]
        rows:
          - cells: ["LLaMA2-7B", "最佳基线", "0.7290", "0.7066", "0.7110", "0.7241"]
          - cells: ["LLaMA2-7B", "ReDeEP (chunk)", "0.7458", "0.7190", "0.7949", "0.7833"]
            highlight: true
          - cells: ["LLaMA2-13B", "最佳基线", "0.8089", "0.7342", "0.7214", "0.7200"]
          - cells: ["LLaMA2-13B", "ReDeEP (chunk)", "0.8244", "0.7587", "0.8420", "0.7603"]
            highlight: true
    insights:
      - "在八组骨干模型、数据集与指标的组合上，ReDeEP (chunk) 都超过了表中最强的非 ReDeEP 结果。"
      - "Dolly AUC 的增幅最大：LLaMA2-7B 提高 0.0839，LLaMA2-13B 提高 0.1206。"
      - "联合建模外部上下文使用和参数知识注入，比只依赖输出信号的检测更有效。"
  research_impact:
    - >-
      ReDeEP 让智能体的证据使用模块变得可检查。未来的智能体会频繁检索、浏览和调用工具，仍需回答一个基本问题：
      它真的使用了自己收集到的证据吗？
    - >-
      这项工作给出了机制层面的检查方法，把最终答案核验推进到内部信息源审计。智能体若要解释、监控并修正自己使用外部信息的方式，
      需要先完成这一步。

- id: rhd
  research_question:
    - >-
      RHD 追问推理幻觉在长推理轨迹的什么位置形成。对大推理模型而言，最终答案只是过程终点；此前还可能经历早期猜测、
      错误子目标、回溯、伪验证和过度思考。
    - >-
      我们把幻觉视为沿时间展开的事件。错误通常在终点才显现，却可能早在模型跟随浅层模式或接受不可靠中间状态时就已经开始。
    - >-
      因此，RHD 对应 AI 智能体中的推理与规划模块：如何观察推理轨迹，如何识别异常动态，以及怎样通过过程训练减少不可靠路径。
  motivation:
    - >-
      大推理模型会写出中间步骤，这给过程检查提供了入口，也带来新的误判风险。推理文本看起来有条理，内部过程仍可能很浅或很不稳定。
    - >-
      只按最终答案评分过于粗糙。模型可能碰巧答对，也可能在许多看似自洽的步骤后答错。两种情况下，最终标签都遮住了路径质量。
    - >-
      RHD 直接评估轨迹中的推理可靠性。如果能在答案产生前识别故障，系统就可以直接介入当前推理过程，无需等到终点再重排或修正。
  approach:
    - >-
      方法引入轨迹级测量，把中间推理转成可分析信号。Reasoning Score 区分有实质内容的推理与浅层模式匹配；CV Score 和
      Attention Score 分别描述轨迹波动与注意力转移。
    - >-
      RHD 用这些信号验证两种推理幻觉模式：早期推理深度出现较大波动；后期错误回溯到先前的浅层步骤或过度思考步骤。
      进一步的机制分析把过高的 Reasoning Score 与困惑度、伪验证行为联系起来。
    - >-
      在缓解阶段，Reasoning Score 被改造成步骤级深度推理奖励。GRPO-R 通过基于势函数的奖励塑形加入这一信号，鼓励充分推理，
      同时惩罚过浅或过度的步骤。
    - >-
      这项工作把 ReDeEP 的信息源分析延伸到时间维度。ReDeEP 检查模型有没有使用正确证据，RHD 检查整个推理过程是否持续可靠。
  key_findings:
    - eyebrow: "发现 1"
      title: "Reasoning Score 能区分浅层与深层推理步骤"
      paragraphs:
        - >-
          在 GSM-NoOp 上，被语义无关短语误导的步骤，其 Reasoning Score 低于未受误导的步骤。该分数可以作为浅层模式匹配的内部信号。
        - >-
          计算时，我们用 LogitLens 投影后层隐藏状态，并测量层间词表分布变化，因此在最终答案产生前就可以观察推理深度。
    - eyebrow: "发现 2"
      title: "两种轨迹模式可以定位推理幻觉"
      paragraphs:
        - >-
          幻觉轨迹在早期表现出更大的 Reasoning Score 波动，后期也更容易把注意力放回先前的浅层或过度思考步骤。
          CV Score 与 Attention Score 分别把这两种模式量化。
        - >-
          这些模式在 ReTruthQA 的 Math、Science 和 MultiHopQA 子集上得到验证，说明案例中的动态并非只出现在单一任务。
    - eyebrow: "发现 3"
      title: "过度思考具有可测量的不确定性特征"
      paragraphs:
        - >-
          机制分析比较 Reasoning Score 上升、步骤一致性和困惑度。分数持续上升有时对应的是过度思考和伪验证，并非可靠纠错。
        - >-
          因而 Reasoning Score 不能简单理解为越高越好。异常浅薄的步骤和看似过深的步骤，都可能属于不可靠轨迹。
    - eyebrow: "发现 4"
      title: "GRPO-R 把诊断信号变成步骤级奖励"
      paragraphs:
        - >-
          GRPO-R 通过基于势函数的塑形，把机制分析得到的深度推理信号加入强化学习。奖励直接作用于中间步骤，同时保留结果目标。
        - >-
          论文给出泛化分析和实验结果，说明 GRPO-R 能改善推理质量并减少幻觉，把轨迹诊断连接到过程控制。
  narrative_sections:
    - figure: "/images/research/rhd-method-score.png"
      title: "如何测量推理轨迹"
      role: "Method"
      source: "Paper Fig. 1; graphs/method.pdf"
      layout: "wide"
      summary: "方法图说明隐藏状态、LogitLens 词表分布、Reasoning Score、CV Score 和 Attention Score 如何沿推理步骤计算。"
      paragraphs:
        - >-
          左侧从 Transformer 解码层开始：多头自注意力和 FFN 更新隐藏状态，LogitLens 再把中间状态映射到词表分布。
          中间的网格沿 c1、c2、c3 直到 cK 跟踪各个推理步骤的分布。
        - >-
          顶部彩色三角形表示各步骤的推理状态，用于计算随步骤变化的 R_score。右侧把 CV Score 定义为标准差与均值之比；
          Attention Score 统计高注意力的历史步骤中，Reasoning Score 落入浅层或过度思考区间的比例。后文所说的“波动”“稳定”
          和“误导性注意”都来自这套测量流程。
      reading_guide:
        - "沿隐藏状态 h 到 LogitLens 的路径，可以看到每一步词表分布的来源。"
        - "R_score 是整条轨迹中逐步变化的推理强度信号。"
        - "CV Score 描述早期波动；Attention Score 描述后期是否关注了浅层或过度思考步骤。"
    - figure: "/images/research/rhd-trajectory-case.png"
      title: "答案出错以前，轨迹已经偏离"
      role: "Problem"
      source: "Paper Fig. 2; graphs/case_study.pdf"
      layout: "wide"
      summary: "案例图在同一道通胀应用题上，对比了波动明显的幻觉轨迹和较稳定的忠实轨迹。"
      paragraphs:
        - >-
          题目给定去年的价格便宜 10%，要求计算 Liam 现在应支付的金额。左图是约 100 个步骤的幻觉轨迹，R_score 起伏明显；
          右图的忠实轨迹更短，R_score 也更稳定。
        - >-
          下方文本框把曲线和具体推理事件连在一起。即使在幻觉轨迹中，步骤 2 到 3 仍是正确验证；步骤 44 到 45 被标为错误验证和
          过度思考；步骤 73 则发生错误回溯或误导性注意，最后得到 261.9，而标准答案是 291。错误因此可以定位到具体时间点。
      reading_guide:
        - "红色标注把分数波动与具体故障事件对应起来。"
        - "可将幻觉轨迹的步骤 44–45、步骤 73，与忠实轨迹的步骤 23–24 验证过程比较。"
        - "261.9 与标准答案 291 的差异是轨迹前期失稳后的终点结果。"
    - title: "验证误导性推理模式"
      role: "Results"
      toc_label: "模式验证"
      source: "Paper Fig. 3; graphs/js_div_comparison_correct.pdf + graphs/cv_scatter_math.pdf + graphs/attention_scores_math.pdf"
      layout: "wide"
      panel_layout: "three"
      summary: "三个柱图分别验证 Reasoning Score、CV Score 和 Attention Score。"
      panels:
        - image: "/images/research/rhd-pattern-reasoning-score.png"
          label: "(a) GSM-NoOp 上的 Reasoning Score 验证"
          source: "graphs/js_div_comparison_correct.pdf"
        - image: "/images/research/rhd-pattern-cv-score.png"
          label: "(b) ReTruthQA 上的模式 #1：早期波动"
          source: "graphs/cv_scatter_math.pdf"
        - image: "/images/research/rhd-pattern-attention-score.png"
          label: "(c) ReTruthQA 上的模式 #2：误导性注意"
          source: "graphs/attention_scores_math.pdf"
      paragraphs:
        - >-
          (a) 比较受误导步骤和未受误导步骤的平均 Reasoning Score。未受误导一组更高，符合“有效推理步骤应带有更强推理信号”的解释。
        - >-
          (b) 与 (c) 分别比较忠实和幻觉样本的 CV Score、Attention Score。图中幻觉样本两项分数都更高，与案例图一致：
          幻觉轨迹波动更大，也更容易把注意力集中在有问题的步骤上。
      reading_guide:
        - "(a) 用受误导与未受误导的推理状态检验 R_score。"
        - "(b) 把较高的轨迹波动与幻觉联系起来。"
        - "(c) 检验幻觉轨迹是否更关注有问题的历史步骤。"
    - title: "从轨迹动态走向可靠性分析"
      role: "Results"
      toc_label: "机制分析"
      source: "Paper Fig. 4; graphs/reasoning_consistency.pdf + graphs/rising_samples_analysis.pdf + graphs/ppl_r_score_scatter.pdf + graphs/perplexity_Science_fine_last_plot.pdf"
      layout: "wide"
      panel_layout: "four"
      summary: "饼图、柱图和散点图共同分析一致性上升、Reasoning Score 与困惑度之间的关系。"
      panels:
        - image: "/images/research/rhd-consistency-reasoning.png"
          label: "(a) 一致性分析"
          source: "graphs/reasoning_consistency.pdf"
        - image: "/images/research/rhd-rising-accuracy.png"
          label: "(b) Rising-2 准确率比较"
          source: "graphs/rising_samples_analysis.pdf"
        - image: "/images/research/rhd-ppl-rscore.png"
          label: "(c) Reasoning Score 与困惑度"
          source: "graphs/ppl_r_score_scatter.pdf"
        - image: "/images/research/rhd-rising-perplexity.png"
          label: "(d) Rising-2 与稳定状态的困惑度"
          source: "graphs/perplexity_Science_fine_last_plot.pdf"
      paragraphs:
        - >-
          (a) 和 (b) 比较一致性上升与稳定一致性。饼图显示，前者包含的“不一致”比例明显更高；相邻柱图则比较连续步骤之间的一致率。
        - >-
          (c) 将困惑度与 Reasoning Score 放在同一散点图中，图中呈下降趋势：分数越高，困惑度通常越低。(d) 再比较 Rising-2
          和稳定条件的平均困惑度。这些结果把轨迹分数与可测量的不确定性联系起来，而不是停留在案例描述。
      reading_guide:
        - "(a)–(b) 把一致性读作相邻步骤的属性，不是最终答案的属性。"
        - "(c) 中可直接观察 R_score 与困惑度的负向趋势。"
        - "(d) 检查轨迹模式是否伴随可测量的不确定性差异。"
  main_results:
    title: "主要实验结果"
    summary: >-
      RHD 同时作为推理幻觉检测器和缓解阶段的过程信号进行测试。第一张表报告 ReTruthQA 各领域上的 AUC 与 MC3；
      第二张表给出 GRPO-R 对下游推理准确率的影响。
    tables:
      - title: "ReTruthQA 推理幻觉检测"
        note: "AUC 衡量二分类检测，MC3 衡量多轨迹排序；取值范围均为 0–1。"
        columns: ["骨干模型", "MATH AUC", "MATH MC3", "Science AUC", "Science MC3", "MultiHop AUC", "MultiHop MC3"]
        rows:
          - cells: ["R1-7B + RHD", "0.7978", "0.5699", "0.7194", "0.6009", "0.7361", "0.7103"]
            highlight: true
          - cells: ["R1-14B + RHD", "0.7292", "0.4644", "0.7686", "0.5671", "0.7255", "0.5154"]
            highlight: true
      - title: "使用 GRPO-R 缓解推理幻觉"
        note: "表中为 MATH500、AIME 2024 和 GPQA 上的准确率，取值范围为 0–1。"
        columns: ["骨干模型", "方法", "MATH500", "AIME", "GPQA-D", "GPQA-M", "GPQA-E"]
        rows:
          - cells: ["DeepSeek-R1-1.5B", "GRPO", "0.770", "0.333", "0.359", "0.335", "0.359"]
          - cells: ["DeepSeek-R1-1.5B", "GRPO-R", "0.788", "0.367", "0.414", "0.371", "0.357"]
            highlight: true
          - cells: ["Qwen2.5-1.5B", "GRPO", "0.480", "0.033", "0.247", "0.214", "0.266"]
          - cells: ["Qwen2.5-1.5B", "GRPO-R", "0.490", "0.133", "0.247", "0.243", "0.275"]
            highlight: true
    insights:
      - "在 R1-7B 和 R1-14B 上，RHD 的 AUC 都是主表三个领域中报告的最高结果。"
      - "GRPO-R 在十组骨干模型与基准组合中提升八组、持平一组，仅在一组 GPQA-E 比较中略低。"
      - "检测不稳定轨迹所用的推理深度信号，也能用于训练更可靠的策略，诊断与控制由此共用同一过程信号。"
  research_impact:
    - >-
      RHD 补上了“AI 智能体认知神经科学”中的时间推理层，使只看答案的评估无法观察到的推理路径变得可测量。
    - >-
      任何需要多步规划、搜索、证明或调试的智能体都会遇到这个问题。可靠性既取决于答案是否正确，也取决于生成答案的路径是否稳定、
      是否随证据调整，并能否在出错后自行修正。

- id: fpps
  research_question:
    - >-
      FPPS 研究个性化语言模型如何在服务用户具体需求的同时，避免用户历史扭曲客观事实。个性化既提供能力，也会引入风险。
    - >-
      当任务确实依赖用户时，模型应记住偏好、长期目标、本地语境和既往互动。但事实问题要求可核验的证据；若用户信念或历史记录
      指向另一方向，同一份记忆就可能干扰回答。
    - >-
      我们从表征层分析这一问题：个性化信息在哪些位置进入隐藏状态，何时与事实知识纠缠，以及怎样在保留有用个性化的前提下修正表征。
  motivation:
    - >-
      个性化模型能够延续对话、适应写作习惯、记住领域需求，并减少用户反复说明。在长期智能体中，记忆会直接影响使用体验。
    - >-
      但记忆并非中性的上下文。用户历史可能包含错误信念、过时偏好、局部误解或特定任务中的假设。模型一旦把这些内容当作事实证据，
      个性化就会成为幻觉来源。
    - >-
      这种失败会随时间积累。相同历史在一个问题上有帮助，在另一个问题上却会误导回答。FPPS 因此把个性化幻觉定义为长时间尺度上的
      记忆调制问题。
  approach:
    - >-
      FPPS 先区分“个性化有益”和“事实受损”两类样本。方法要保留真正有帮助的用户适配，只在历史信息扭曲事实答案时减弱其影响。
    - >-
      随后，我们分析隐藏状态的几何关系，检查个性化方向与事实方向是否分离，或已经变得非正交。两种方向纠缠时，贴近用户的表征可能
      把模型拉离事实可靠的状态。
    - >-
      基于这一诊断，FPPS 提出事实保持的个性化引导：选择对个性化敏感的层，用探针检测事实风险，并在推理阶段自适应干预。
      对强烈的有害个性化进行抑制；对较弱的偏移，则用事实保持方向进行校正。
    - >-
      记忆在这里是一种需要监控的控制信号。同一段用户历史既可能支持个性化，也可能引起事实漂移，干预策略必须根据当前问题作出选择。
  key_findings:
    - eyebrow: "发现 1"
      title: "个性化带来事实性权衡"
      paragraphs:
        - >-
          个性化可以提高回答与用户的匹配程度，但客观事实与记忆上下文冲突时，事实可靠性可能下降。
        - >-
          因而目标不在于一味增加个性化。我们需要让个性化遵守事实边界，并在适当的查询上发挥作用。
    - eyebrow: "发现 2"
      title: "故障可以在表征几何中观察到"
      paragraphs:
        - >-
          论文把个性化幻觉解释为隐藏状态纠缠。个性化与事实性并不总是两条独立方向，它们可能在解码前就相互作用并造成偏置。
        - >-
          如果表征已经被拉向符合用户历史但事实错误的状态，最终回答即使流畅、贴合用户，也仍然不可靠。此时仅过滤输出已经太晚。
    - eyebrow: "发现 3"
      title: "选择性引导可以保留有用的个性化"
      paragraphs:
        - >-
          FPPS 通过层选择和事实风险探针判断是否需要干预，比删除全部用户历史或关闭个性化更细致。
        - >-
          方法保留对当前任务有帮助的用户适配，只在内部状态开始威胁事实可靠性时修正方向。
    - eyebrow: "发现 4"
      title: "历史越长，越需要显式监控"
      paragraphs:
        - >-
          历史长度实验和控制模拟表明，记忆持续积累时，个性化风险可能随之增加。短提示中的干扰尚可控制，长期助手则需要专门检查记忆
          如何改变事实行为。
        - >-
          因此，FPPS 直接面向带有持久记忆、用户画像和长期任务上下文的智能体。
  narrative_sections:
    - figure: "/images/research/fpps-personalization-case-web.png"
      title: "个性化何时开始覆盖事实"
      role: "Problem"
      source: "Paper Fig. 1; latex/graphs/introduction.pdf"
      layout: "two-column"
      summary: "图中依次比较普通 LLM、产生个性化幻觉的个性化 LLM，以及加入 FPPS 后的个性化 LLM。"
      paragraphs:
        - >-
          顶部是普通 LLM 对两类问题的回答。面对关于纽约第 161 志愿步兵团的事实问题，模型回答“1861 年亚伯拉罕·林肯就职”；
          面对濯足星期四礼拜的个性化问题，由于没有聊天历史，模型无法作答。两种情况分别对应图中的事实查询和个性化查询。
        - >-
          中间加入聊天历史：用户是圣公会教徒，历史中还包含第一次世界大战语境。模型因此能回答个性化问题，却把事实答案改成“伍德罗·威尔逊”
          和第一次世界大战，产生个性化诱发的幻觉。底部是 FPPS 的目标：保留正确的个性化回答，同时把事实答案恢复为林肯就职。
      reading_guide:
        - "蓝色 Fact Query 框对应事实问答，粉色 Personalized Query 框对应依赖用户历史的回答。"
        - "中间一行是故障：聊天历史帮助了个性化问题，却污染了事实问题。"
        - "底部方向盘图标表示 FPPS，它要把这两种影响分开处理。"
    - figure: "/images/research/fpps-representation-entanglement.png"
      title: "事实性与个性化方向并不总能分开"
      role: "Mechanism"
      source: "Paper Fig. 2; latex/graphs/empirical.pdf"
      layout: "two-column"
      summary: "左图画出事实表征、个性化表征及其纠缠方向；右图比较幻觉样本与忠实样本的余弦相似度。"
      paragraphs:
        - >-
          左侧示意图定义了几何关系：蓝色事实表征向上，粉色个性化表征斜向伸出，纠缠后的表征位于两者之间。夹角 θ 描述事实方向与
          个性化方向的关系，旁边括号标出由此产生的事实偏移。
        - >-
          右侧小提琴图检验这一几何解释，比较幻觉与忠实样本的余弦相似度，并给出 Welch t 检验。忠实样本与目标方向的相似度更高，
          幻觉样本的表征偏移更明显。
      reading_guide:
        - "左图中的 θ 和 factual distortion 括号对应隐藏状态的几何假设。"
        - "右侧小提琴图把这种几何差异与实际的忠实、幻觉样本联系起来。"
        - "故障在解码前已经进入表征，因此干预也应发生在表征层。"
    - figure: "/images/research/fpps-controlled-simulation.png"
      title: "个性化教师会传递事实偏差"
      role: "Controlled Study"
      source: "Paper Fig. 3; latex/graphs/simulation.pdf"
      layout: "wide"
      summary: "控制实验用教师与学生的交互检验个性化是否会改变用户模型学到的事实知识。"
      paragraphs:
        - >-
          小模型扮演用户，大模型扮演教师。实验先去除用户模型已经会回答的问题，再把剩余事实问题与 PFQABench 的个性化历史配对。
          用户模型分别与普通教师或个性化教师进行多轮学习。
        - >-
          对话结束后的用户回答用于测量知识获得。不同教师与学生模型组合中，由个性化 LLM 教授的用户模型事实准确率更低，
          论文报告平均下降 10.5%。这说明表征纠缠还会影响后续知识学习。
      reading_guide:
        - "沿两种教师条件阅读：普通 LLM 与检索用户历史后的个性化 LLM。"
        - "用户模型在学习对话结束后才接受评估，因此结果测量的是知识传递，不是教师当下回答的准确率。"
        - "FPPS 既要保护当前答案，也要减少错误事实传给用户模型的可能。"
    - figure: "/images/research/fpps-method-framework.png"
      title: "事实保持的个性化引导"
      role: "Method"
      source: "Paper Fig. 4; latex/graphs/methods.pdf"
      layout: "wide"
      summary: "方法图分为三个阶段：离线层选择、离线探针检测，以及推理时的自适应引导。"
      paragraphs:
        - >-
          阶段 1 在各层比较“问题 + 用户信息 + 标准答案”和“问题 + 标准答案”，分别计算加入、去掉用户信息后的 PPL 及其相对偏差，
          然后选出层 L。这个阶段定位个性化最明显改变事实预测的位置。
        - >-
          阶段 2 在选定层训练逻辑回归探针，正样本是事实受损状态，负样本是个性化有益状态。阶段 3 在推理时使用探针：若预测概率
          p-hat 超过阈值 tau，FPPS-H 减去用户历史方向；否则 FPPS-S 用事实引导方向 s_f 组合事实与个性化信息，再生成回答。
      reading_guide:
        - "阶段 1 根据 PPL 偏差选层，这一步不是训练分类器。"
        - "阶段 2 在选定层区分事实受损状态和个性化有益状态。"
        - "阶段 3 根据检测风险选择干预：高纠缠使用 FPPS-H，较低风险使用 FPPS-S。"
    - title: "用更长历史检验事实鲁棒性"
      role: "Results"
      toc_label: "历史长度"
      source: "Paper Fig. 5; latex/graphs/history_length/*.pdf"
      layout: "wide"
      panel_layout: "three"
      summary: "三幅图分别给出 LLaMA3.1-8B-IT、Qwen2.5-7B-IT 和 Qwen2.5-14B-IT 的 F-Score 随历史长度比例变化的曲线。"
      panels:
        - image: "/images/research/fpps-history-llama31-8b.png"
          label: "(a) LLaMA3.1-8B-IT"
          source: "latex/graphs/history_length/history_length_fscore_LLaMA3.1-8B.pdf"
        - image: "/images/research/fpps-history-qwen25-7b.png"
          label: "(b) Qwen2.5-7B-IT"
          source: "latex/graphs/history_length/history_length_fscore_Qwen2.5-7B.pdf"
        - image: "/images/research/fpps-history-qwen25-14b.png"
          label: "(c) Qwen2.5-14B-IT"
          source: "latex/graphs/history_length/history_length_fscore_Qwen2.5-14B.pdf"
      paragraphs:
        - >-
          每幅图都比较虚线 Base Model 与实线 Base+FPPS-M。(a) 中，历史比例增加时 LLaMA 基线明显下降，FPPS-M 曲线仍靠近坐标轴顶部；
          (b) 在 Qwen2.5-7B-IT 上出现类似分离；(c) 的差距较小，但方向一致。
        - >-
          横轴就是历史长度比例，因此实验直接检验更多用户历史是否会施加更强的事实干扰。三种模型上虚线与实线持续分离，说明 FPPS-M
          能提高长个性化上下文中的事实稳定性。
      reading_guide:
        - "虚线表示未引导的基础模型，带三角标记的实线表示 Base+FPPS-M。"
        - "LLaMA3.1-8B-IT 的退化最明显，基础曲线随历史比例增加而下降。"
        - "三幅图共同检验 FPPS-M 在更长个性化上下文中的事实问答稳定性。"
    - figure: "/images/research/fpps-simulation-result.png"
      title: "控制个性化模拟中的缓解效果"
      role: "Results"
      toc_label: "缓解结果"
      source: "Paper Fig. 6; latex/graphs/simulation_result_fpps.pdf"
      layout: "two-column"
      summary: "柱图在多组 UI/FI 模型设置下比较控制组、实验组和实验组加 FPPS 的准确率。"
      paragraphs:
        - >-
          分组柱分别表示蓝色 Control、粉色 Experimental 和绿色 Experimental+FPPS。横轴给出 UI/FI 模型组合，例如
          LLaMA3.2-1B 搭配 Qwen2.5-14B，或搭配 LLaMA3.1-8B。
        - >-
          柱顶数值显示，实验组准确率往往低于控制组；加入 FPPS 后，多组设置得到部分恢复，绿色柱明显高于粉色柱的位置最直观。
          该实验以教学式个性化模拟补充历史长度结果，检查引导能否减轻知识传递中的事实损失。
      reading_guide:
